function voteScreen(players){window._vf=null;window._vs=null;var html='<div class="ct" style="padding:16px;animation:up .4s ease"><div class="gt" style="font-size:22px;font-weight:800;margin-bottom:14px">'+t("vote")+'</div>';html+='<div style="font-size:14px;font-weight:700;color:'+T.tx+';margin-bottom:8px">'+t("whoFake")+'</div><div id="vf" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px">';players.filter(function(p){return p.id!==myId}).forEach(function(p){html+='<button style="'+cds("padding:10px 16px;cursor:pointer")+'" onclick="pickV(\'f\',\''+p.id+'\',this)"><b style="font-size:13px;color:'+T.tx+'">'+p.name+'</b></button>'});html+='</div><div style="font-size:14px;font-weight:700;color:'+T.tx+';margin-bottom:8px">'+t("whoSab")+'</div><div id="vs" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px">';players.filter(function(p){return p.id!==myId}).forEach(function(p){html+='<button style="'+cds("padding:10px 16px;cursor:pointer")+'" onclick="pickV(\'s\',\''+p.id+'\',this)"><b style="font-size:13px;color:'+T.tx+'">'+p.name+'</b></button>'});html+='</div><button class="btn" onclick="doVote()">'+t("vote")+'</button></div>';$("app").innerHTML=html}
