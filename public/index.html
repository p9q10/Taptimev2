<!DOCTYPE html><html><head>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
:root{
  --bg:#0B0710;--surf:rgba(20,14,30,.92);--raised:rgba(32,22,50,.75);--border:rgba(100,80,160,.2);
  --gold:#FFB830;--goldb:#FFD06A;--teal:#00FFB8;
  --red:#FF2D55;--green:#00E676;--amber:#FFB830;--blue:#6C63FF;
  --text:#FFF5E8;--sub:#8A7FA0;--muted:rgba(50,35,70,.5);
  --f:'Barlow Condensed',sans-serif;--mono:'IBM Plex Mono',monospace;
  --gG:0 0 36px rgba(255,184,48,.45),0 0 100px rgba(255,184,48,.1);
  --gT:0 0 36px rgba(0,255,184,.4),0 0 100px rgba(0,255,184,.08);
  --gR:0 0 36px rgba(255,45,85,.5),0 0 100px rgba(255,45,85,.12);
  --gGr:0 0 36px rgba(0,230,118,.45),0 0 100px rgba(0,230,118,.1);
  --glass:blur(24px) saturate(1.6);
  --metal:linear-gradient(135deg,rgba(255,255,255,.08) 0%,transparent 50%,rgba(255,255,255,.04) 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--text);min-height:100dvh;
  background-image:
    radial-gradient(ellipse 100% 60% at 50% -10%,rgba(108,99,255,.1) 0%,transparent 55%),
    radial-gradient(ellipse 60% 60% at 10% 90%,rgba(255,184,48,.04) 0%,transparent 50%),
    radial-gradient(ellipse 60% 60% at 90% 80%,rgba(0,255,184,.03) 0%,transparent 50%);
  position:relative}
body::before{content:'';position:fixed;inset:0;opacity:.04;pointer-events:none;z-index:9998;
  background:repeating-conic-gradient(rgba(255,255,255,.03) 0% 25%,transparent 0% 50%) 0 0 / 60px 60px}
body::after{content:'';position:fixed;inset:0;opacity:.03;pointer-events:none;z-index:9997;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:150px}
#app{max-width:440px;margin:0 auto;padding:16px 18px 50px;position:relative}
button{font-family:var(--f);cursor:pointer;border:none;outline:none}
input{font-family:var(--f);outline:none}

.btn{border-radius:999px;padding:18px 40px;color:#0B0710;font-size:15px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  background:linear-gradient(160deg,#FFD875,var(--gold),#E09B10);border:none;
  transition:transform .1s,box-shadow .2s;width:100%;max-width:300px;
  box-shadow:var(--gG),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.15);
  font-family:var(--f);position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg,transparent 0%,rgba(255,255,255,.15) 10%,transparent 20%);
  animation:btnShine 3s linear infinite}
@keyframes btnShine{to{transform:rotate(360deg)}}
.btn:active{transform:scale(.92)}
.btn:disabled{opacity:.2;box-shadow:none}
.btn-blue{background:linear-gradient(160deg,#8B85FF,var(--blue),#4A40E0);color:#fff;box-shadow:0 0 40px rgba(108,99,255,.45)}
.btn-green{background:linear-gradient(160deg,#40FF90,var(--green),#00C060);color:#0B0710;box-shadow:var(--gGr)}
.btn-red{background:linear-gradient(160deg,#FF6080,var(--red),#D01040);color:#fff;box-shadow:var(--gR)}
.btn2{border-radius:999px;padding:11px 24px;color:var(--sub);font-size:13px;font-weight:700;letter-spacing:1px;
  background:var(--raised);border:1px solid var(--border);font-family:var(--f);transition:transform .1s;
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.btn2:active{transform:scale(.94)}

.inp{font-size:16px;color:var(--text);background:rgba(20,14,30,.8);
  border:2px solid var(--border);border-radius:999px;padding:15px 24px;text-align:center;
  width:100%;font-weight:700;font-family:var(--f);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  transition:border-color .3s,box-shadow .3s}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,184,48,.1),0 0 40px rgba(255,184,48,.08)}

.cd{border-radius:28px;background:var(--surf);border:1px solid var(--border);padding:20px;
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
  background-image:var(--metal)}
.ct{text-align:center}
.lb{font-size:10px;color:var(--sub);letter-spacing:4px;text-transform:uppercase;margin-bottom:9px;font-weight:700}

/* LCD-style time display */
.dsp{font-family:var(--mono);color:var(--teal);
  text-shadow:0 0 20px rgba(0,255,184,.6),0 0 60px rgba(0,255,184,.15);
  -webkit-text-stroke:0.5px rgba(0,255,184,.3)}

/* Metallic watch bezel */
.bezel{position:relative;border-radius:50%;
  background:conic-gradient(from 0deg,
    #3A2860 0deg,#2A1840 6deg,#3A2860 12deg,#2A1840 18deg,#3A2860 24deg,#2A1840 30deg,
    #3A2860 30deg,#2A1840 36deg,#3A2860 42deg,#2A1840 48deg,#3A2860 54deg,#2A1840 60deg,
    #3A2860 60deg,#2A1840 66deg,#3A2860 72deg,#2A1840 78deg,#3A2860 84deg,#2A1840 90deg,
    #3A2860 90deg,#2A1840 96deg,#3A2860 102deg,#2A1840 108deg,#3A2860 114deg,#2A1840 120deg,
    #3A2860 120deg,#2A1840 126deg,#3A2860 132deg,#2A1840 138deg,#3A2860 144deg,#2A1840 150deg,
    #3A2860 150deg,#2A1840 156deg,#3A2860 162deg,#2A1840 168deg,#3A2860 174deg,#2A1840 180deg,
    #3A2860 180deg,#2A1840 186deg,#3A2860 192deg,#2A1840 198deg,#3A2860 204deg,#2A1840 210deg,
    #3A2860 210deg,#2A1840 216deg,#3A2860 222deg,#2A1840 228deg,#3A2860 234deg,#2A1840 240deg,
    #3A2860 240deg,#2A1840 246deg,#3A2860 252deg,#2A1840 258deg,#3A2860 264deg,#2A1840 270deg,
    #3A2860 270deg,#2A1840 276deg,#3A2860 282deg,#2A1840 288deg,#3A2860 294deg,#2A1840 300deg,
    #3A2860 300deg,#2A1840 306deg,#3A2860 312deg,#2A1840 318deg,#3A2860 324deg,#2A1840 330deg,
    #3A2860 330deg,#2A1840 336deg,#3A2860 342deg,#2A1840 348deg,#3A2860 354deg,#2A1840 360deg);
  padding:4px;box-shadow:0 0 0 2px rgba(255,184,48,.2),0 0 40px rgba(0,0,0,.6)}

.pchip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;
  border:1px solid var(--border);background:var(--raised);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}

@keyframes pop{0%{transform:scale(.15);opacity:0}55%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(35px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes slideIn{0%{transform:translateY(22px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes splashFade{0%{opacity:1}76%{opacity:1}100%{opacity:0;pointer-events:none}}
@keyframes spinR{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-12px) rotate(-2deg)}30%{transform:translateX(12px) rotate(2deg)}45%{transform:translateX(-8px)}60%{transform:translateX(8px)}75%{transform:translateX(-4px)}90%{transform:translateX(4px)}}
@keyframes sHand{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes goldPulse{0%,100%{box-shadow:0 0 25px rgba(255,184,48,.25),0 8px 40px rgba(0,0,0,.5)}50%{box-shadow:0 0 70px rgba(255,184,48,.75),0 0 150px rgba(255,184,48,.12),0 8px 40px rgba(0,0,0,.5)}}
@keyframes redPulse{0%,100%{box-shadow:0 0 25px rgba(255,45,85,.3),0 8px 40px rgba(0,0,0,.5)}50%{box-shadow:0 0 75px rgba(255,45,85,.8),0 0 150px rgba(255,45,85,.15),0 8px 40px rgba(0,0,0,.5)}}
@keyframes greenPulse{0%,100%{box-shadow:0 0 25px rgba(0,230,118,.3),0 8px 40px rgba(0,0,0,.5)}50%{box-shadow:0 0 80px rgba(0,230,118,.85),0 0 170px rgba(0,230,118,.18),0 8px 40px rgba(0,0,0,.5)}}
@keyframes ringExpand{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.8);opacity:0}}
@keyframes tickFlash{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes breathe{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.02)}}
@keyframes sweepHand{from{transform:translateX(-50%) rotate(0deg)}to{transform:translateX(-50%) rotate(360deg)}}
@keyframes lcdFlicker{0%,100%{opacity:1}50%{opacity:.92}}
</style></head><body>

<!-- ══ SPLASH ══ -->
<div id="splash" style="position:fixed;inset:0;background:#0B0710;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:splashFade 2.6s ease forwards;background-image:radial-gradient(ellipse 50% 40% at 50% 45%,rgba(255,184,48,.06) 0%,transparent 70%),radial-gradient(ellipse 80% 50% at 50% 20%,rgba(108,99,255,.08) 0%,transparent 55%)">
  <div style="position:relative;width:160px;height:190px;margin-bottom:24px">
    <!-- Crown -->
    <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:22px;background:linear-gradient(180deg,#FFD875,#E09B10);border-radius:8px 8px 3px 3px;box-shadow:0 0 20px rgba(255,184,48,.5)"></div>
    <!-- Start pusher -->
    <div style="position:absolute;top:38px;right:-4px;width:14px;height:18px;background:linear-gradient(90deg,#2A1840,#3A2860);border-radius:0 5px 5px 0;border:1px solid rgba(100,80,160,.3)"></div>
    <!-- Lap pusher -->
    <div style="position:absolute;top:68px;right:-2px;width:10px;height:14px;background:linear-gradient(90deg,#2A1840,#3A2860);border-radius:0 4px 4px 0;border:1px solid rgba(100,80,160,.2)"></div>
    <!-- Lugs -->
    <div style="position:absolute;top:22px;left:8px;width:24px;height:7px;background:linear-gradient(90deg,#2A1840,#1A0E28);border-radius:4px;transform:rotate(-22deg);border:1px solid rgba(100,80,160,.15)"></div>
    <div style="position:absolute;top:22px;right:8px;width:24px;height:7px;background:linear-gradient(-90deg,#2A1840,#1A0E28);border-radius:4px;transform:rotate(22deg);border:1px solid rgba(100,80,160,.15)"></div>
    <!-- Main case -->
    <div class="bezel" style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:148px;height:148px">
      <!-- Cardinal markers -->
      <div style="position:absolute;top:2px;left:50%;width:3px;height:16px;background:var(--gold);transform:translateX(-50%);border-radius:2px;box-shadow:0 0 8px rgba(255,184,48,.7);z-index:2"></div>
      <div style="position:absolute;right:2px;top:50%;width:16px;height:3px;background:var(--gold);transform:translateY(-50%);border-radius:2px;z-index:2"></div>
      <div style="position:absolute;bottom:2px;left:50%;width:3px;height:16px;background:var(--gold);transform:translateX(-50%);border-radius:2px;z-index:2"></div>
      <div style="position:absolute;left:2px;top:50%;width:16px;height:3px;background:var(--gold);transform:translateY(-50%);border-radius:2px;z-index:2"></div>
      <!-- Watch face -->
      <div style="position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1A1228,#0B0710);border:1px solid rgba(100,80,160,.15);overflow:hidden">
        <!-- Sub-dial decoration -->
        <div style="position:absolute;top:20%;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,184,48,.15)"></div>
        <!-- Hour hand -->
        <div style="position:absolute;bottom:50%;left:50%;width:4px;height:26px;background:linear-gradient(0deg,#FFF5E8,#AEA090);transform-origin:bottom center;transform:translateX(-50%) rotate(135deg);border-radius:3px 3px 0 0"></div>
        <!-- Minute hand -->
        <div style="position:absolute;bottom:50%;left:50%;width:3px;height:40px;background:linear-gradient(0deg,#FFF5E8,#C0B8A8);transform-origin:bottom center;transform:translateX(-50%) rotate(-40deg);border-radius:2px 2px 0 0"></div>
        <!-- Counterweight -->
        <div style="position:absolute;top:50%;left:50%;width:3px;height:14px;background:var(--gold);opacity:.4;transform-origin:top center;transform:translateX(-50%)"></div>
        <!-- Sweep second hand -->
        <div style="position:absolute;bottom:50%;left:50%;width:1.5px;height:48px;background:linear-gradient(0deg,transparent 0%,var(--gold) 25%);transform-origin:bottom center;transform:translateX(-50%);border-radius:2px;animation:sHand 2s steps(60) infinite;box-shadow:0 0 10px rgba(255,184,48,.8)"></div>
        <!-- Center jewel -->
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#FFD875,#E09B10);z-index:4;box-shadow:0 0 14px rgba(255,184,48,1)"></div>
      </div>
    </div>
  </div>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:700;color:var(--gold);letter-spacing:12px;text-shadow:0 0 50px rgba(255,184,48,.4)">TIMETAP</div>
  <div style="font-size:11px;color:#8A7FA0;margin-top:6px;letter-spacing:8px;font-family:var(--f);font-weight:700">PARTY GAME</div>
  <div style="margin-top:30px;width:24px;height:24px;border:2px solid rgba(100,80,160,.3);border-top-color:var(--gold);border-radius:50%;animation:spinR .7s linear infinite"></div>
</div>

function memSub(){var el=$("mI");if(!el)return;var g=parseFloat(el.value);if(isNaN(g))return;var shown=room.roundData.shownTime;var dec=room.roundData.decimals||3;var dev=Math.abs(g-shown);if(dev<.05){sfxGood();vb([40,20,40])}else{sfxBad();vb(60)}var rc=dev<.05?"#00E676":dev<.3?"#FFB830":"#FF2D55";var mc=$("mC");if(mc)mc.innerHTML='<div style="animation:pop .35s ease"><div style="font-size:12px;color:var(--sub);margin-bottom:6px;font-weight:700">Tipp: <span class="dsp" style="font-size:15px;font-weight:600">'+g.toFixed(dec)+'s</span></div><div style="font-size:12px;color:var(--sub);margin-bottom:16px;font-weight:700">Richtig: <span style="font-family:var(--mono);color:var(--gold);font-size:15px;font-weight:700">'+shown.toFixed(dec)+'s</span></div><div style="font-size:20px;font-weight:900;color:'+rc+';letter-spacing:3px">'+dev.toFixed(dec)+'s Abweichung</div></div>';doSubmit(dev)}

function renderReaction(hdr){var gIdx=room.roundData.greenIdx;var bhtml='';for(var i=0;i<10;i++){bhtml+='<div id="rz'+i+'" onclick="rzTap('+i+')" style="width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#400E20,#200510);border:2.5px solid #FF2D55;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 10px rgba(255,45,85,.1);transition:all .15s;user-select:none;font-family:var(--mono);font-size:10px;color:rgba(255,45,85,.3);font-weight:700">'+(i+1)+'</div>'}$("app").innerHTML='<div style="animation:up .3s ease">'+hdr+'<div class="cd" style="padding:24px;border-radius:32px"><div class="ct"><div style="font-size:12px;color:var(--sub);margin-bottom:24px;font-weight:700;letter-spacing:2px">Warte auf GRÜN!</div><div id="rzGrid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:340px;margin:0 auto">'+bhtml+'</div><div id="rzSub" style="font-size:11px;color:var(--sub);margin-top:22px;font-weight:700">Nicht zu früh!</div></div></div></div>';window._rs="ready";window._rGreen=gIdx;window._rt=setTimeout(function(){if(!room||room.phase!=="playing")return;window._rs="go";window._r0=performance.now();sfxGo();vb([80,30,80,30,120]);var gz=$("rz"+gIdx);if(!gz)return;gz.style.background="radial-gradient(circle at 30% 25%,#083018,#041208)";gz.style.borderColor="#00E676";gz.style.color="#00E676";gz.style.boxShadow="0 0 50px rgba(0,230,118,.75),0 0 100px rgba(0,230,118,.2)";gz.style.animation="greenPulse 0.65s ease infinite";gz.style.transform="scale(1.12)";var s=$("rzSub");if(s){s.style.color="#00E676";s.textContent="Grünen drücken!"}},2000+Math.random()*4000)}
function rzTap(idx){if(window._rs==="ready"){clearTimeout(window._rt);window._rs="early";sfxBad();vb(80);var b=$("rz"+idx);if(b){b.style.background="var(--raised)";b.style.borderColor="var(--sub)";b.style.color="var(--sub)";b.style.animation="none";b.style.boxShadow="none"}var s=$("rzSub");if(s)s.innerHTML='<div style="color:#FF2D55;font-weight:800;font-size:13px;letter-spacing:2px;margin-bottom:16px">ZU FRÜH! 5s Strafe</div><button class="btn" style="max-width:200px" onclick="doSubmit(5)">Weiter</button>'}else if(window._rs==="go"){window._rs="done";if(idx!==window._rGreen){sfxBad();vb(80);var s2=$("rzSub");if(s2)s2.innerHTML='<div style="color:#FF2D55;font-weight:800;letter-spacing:2px">Falscher Buzzer! 5s</div>';doSubmit(5);return}var rt=(performance.now()-window._r0)/1000;if(rt<.25){sfxGood();vb([40,20,40])}else{sfxBad();vb(60)}var b2=$("rz"+idx);if(b2){b2.style.background="radial-gradient(circle at 30% 25%,#302048,#0D0918)";b2.style.borderColor="var(--gold)";b2.style.color="var(--gold)";b2.style.animation="none";b2.style.boxShadow="0 0 28px rgba(255,184,48,.4)";b2.style.transform="scale(1)"}var rc=rt<.2?"#00E676":rt<.35?"#FFB830":"#FF2D55";var rt2=rt<.2?"BLITZ!":rt<.35?"SCHNELL!":"LANGSAM!";var s3=$("rzSub");if(s3)s3.innerHTML=lcdPanel(rt.toFixed(3)+'s','30')+'<div style="font-size:14px;font-weight:900;color:'+rc+';letter-spacing:3px;margin-top:10px">'+rt2+'</div>';doSubmit(rt)}}

function renderResults(){submitted=false;sfxGood();vb(30);var res=room.results||[],isHost=room.hostId===room.myId,m=MI[room.mode]||MI.bullseye;var html='<div style="animation:pop .4s ease"><div class="ct" style="margin-bottom:20px"><div class="lb">Runde '+room.currentRound+'</div><div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px"><div style="width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,'+m.color+'20,'+m.color+'06);border:2px solid '+m.color+';display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 28px '+m.color+'40">'+m.icon+'</div><div style="font-size:17px;font-weight:900;color:'+m.color+';letter-spacing:2px">'+m.name.toUpperCase()+'</div></div></div><div class="cd" style="margin-bottom:24px;border-radius:28px;padding:8px 16px">';res.forEach(function(r,i){var medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1);var isMe=r.pid===room.myId;html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 6px;border-bottom:'+(i<res.length-1?"1px solid rgba(100,80,160,.1)":"none")+';animation:slideIn .3s ease '+(i*.08)+'s both'+(i===0?';background:rgba(255,184,48,.03);border-radius:16px;margin:0 -6px;padding:14px 12px':'')+'"><div style="display:flex;align-items:center;gap:12px"><span style="font-size:'+(i<3?'19':'12')+'px;width:28px;text-align:center">'+medal+'</span><div style="width:44px;height:44px;border-radius:50%;background:var(--raised);border:2.5px solid '+(isMe?"var(--gold)":"var(--border)")+';display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:'+(isMe?"0 0 20px rgba(255,184,48,.3)":"none")+'">'+avHTML(r.avatar,32)+'</div><span style="font-size:14px;font-weight:800;color:'+(isMe?"var(--gold)":"var(--text)")+'">'+r.name+'</span></div><div class="dsp" style="font-size:14px;color:'+(i===0?"var(--teal)":"var(--sub)")+';font-weight:600">'+r.value.toFixed(3)+'s</div></div>'});html+='</div>';if(isHost){html+='<div class="ct" style="display:flex;flex-direction:column;align-items:center;gap:14px"><button class="btn" onclick="so.emit(\'nextRound\')">Weiter ▶</button><button class="btn2" style="font-size:10px;letter-spacing:2px" onclick="so.emit(\'endGame\')">BEENDEN</button></div>'}else{html+='<div class="ct" style="font-size:11px;color:var(--sub);margin-top:18px;font-weight:700;animation:breathe 2s ease infinite">Warte auf den Host...</div>'}html+='</div>';$("app").innerHTML=html}

function renderElimination(){sfxElim();vb([80,40,80,40,200]);var eliminated=room.players.filter(function(p){return p.eliminated});var last=eliminated[eliminated.length-1];var active=room.players.filter(function(p){return!p.eliminated&&p.connected});var isHost=room.hostId===room.myId;$("app").innerHTML='<div class="ct" style="animation:pop .5s ease;padding-top:28px"><div style="position:relative;width:105px;height:105px;margin:0 auto 24px"><div style="position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(255,45,85,.12);animation:ringExpand 1s ease infinite"></div><div style="position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(255,45,85,.06);animation:ringExpand 1s ease .3s infinite"></div><div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,#400E20,#200510);border:3px solid #FF2D55;box-shadow:0 0 70px rgba(255,45,85,.4);animation:shake .5s ease"></div><div style="position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px">💀</div></div><div style="font-family:var(--mono);font-size:16px;color:#FF2D55;letter-spacing:6px;margin-bottom:16px;text-shadow:0 0 28px rgba(255,45,85,.45);font-weight:700">ELIMINATION</div>'+(last?'<div style="margin:14px 0">'+avHTML(last.avatar,64)+'</div><div style="font-size:19px;font-weight:900;color:#FF2D55">'+last.name+'</div><div style="font-size:12px;color:var(--sub);margin-top:6px;margin-bottom:24px;font-weight:700">ist raus!</div>':'')+'<div style="font-size:12px;color:var(--sub);margin-bottom:16px;font-weight:700">Noch '+active.length+' Spieler</div><div style="display:flex;gap:12px;justify-content:center;margin-bottom:32px">'+active.map(function(p){return'<div style="font-size:24px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--raised);border:1px solid var(--border);box-shadow:0 6px 18px rgba(0,0,0,.35)">'+avHTML(p.avatar,30)+'</div>'}).join('')+'</div>'+(isHost?'<button class="btn" onclick="so.emit(\'continueAfterElim\')">Weiter</button>':'<div style="font-size:11px;color:var(--sub);font-weight:700;animation:breathe 2s ease infinite">Warte auf Host...</div>')+'</div>'}

function renderGameOver(){submitted=false;sfxWin();vb([50,30,50,30,50,30,100]);var sc=room.finalScores||{};var sorted=Object.entries(sc).sort(function(a,b){return b[1]-a[1]});var isHost=room.hostId===room.myId;var winner=room.players.find(function(p){return!p.eliminated&&p.connected});var html='<div style="animation:pop .5s ease"><div class="ct" style="margin-bottom:28px"><div style="font-size:72px;animation:float 2.5s ease infinite;filter:drop-shadow(0 0 35px rgba(255,184,48,.45)) drop-shadow(0 0 80px rgba(255,184,48,.12))">🏆</div>'+(winner?'<div style="margin-top:8px">'+avHTML(winner.avatar,60)+'</div><div style="font-family:var(--mono);font-size:14px;color:var(--gold);margin-top:12px;letter-spacing:5px;text-shadow:0 0 28px rgba(255,184,48,.45);font-weight:700">'+winner.name.toUpperCase()+' GEWINNT!</div>':'<div style="font-family:var(--mono);font-size:15px;color:var(--gold);margin-top:14px;letter-spacing:6px;font-weight:700">SPIEL VORBEI</div>')+'</div><div class="cd" style="margin-bottom:24px;border-radius:28px;padding:8px 14px">';sorted.forEach(function(e,i){var pid=e[0],pts=e[1];var p=room.players.find(function(x){return x.id===pid});if(!p)return;var medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1);var isW=i===0;html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:'+(isW?"18px 8px":"12px 8px")+';border-bottom:'+(i<sorted.length-1?"1px solid rgba(100,80,160,.1)":"none")+';animation:slideIn .4s ease '+(i*.1)+'s both'+(isW?';background:rgba(255,184,48,.03);border-radius:16px;margin:0 -4px;padding:18px 12px':'')+'"><div style="display:flex;align-items:center;gap:12px"><span style="font-size:'+(isW?'23':'17')+'px;width:28px">'+medal+'</span><div style="width:'+(isW?56:44)+'px;height:'+(isW?56:44)+'px;border-radius:50%;background:var(--raised);border:2.5px solid '+(isW?"var(--gold)":"var(--border)")+';display:flex;align-items:center;justify-content:center;font-size:'+(isW?30:20)+'px;box-shadow:'+(isW?"0 0 28px rgba(255,184,48,.35)":"none")+'">'+avHTML(p.avatar,32)+'</div><span style="font-size:'+(isW?'16':'13')+'px;font-weight:900;color:'+(isW?"var(--gold)":"var(--text)")+'">'+p.name+(p.eliminated?' <span style="font-size:9px;color:#FF2D55;font-weight:800">✕</span>':'')+'</span></div><div style="font-family:var(--mono);font-size:'+(isW?'19':'13')+'px;color:'+(isW?"var(--gold)":"var(--sub)")+';font-weight:700">'+pts+'</div></div>'});html+='</div>';if(isHost)html+='<div class="ct" style="margin-bottom:16px"><button class="btn" onclick="so.emit(\'playAgain\')">Nochmal</button></div>';html+='<div class="ct"><button class="btn2" onclick="home()">← Startseite</button></div></div>';$("app").innerHTML=html}
</script></body></html>
