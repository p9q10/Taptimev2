<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>TimeTap</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
:root{
  --bg:#06060E;--surf:#0D0D1E;--raised:#161630;--border:#22224A;
  --gold:#F4B942;--goldb:#FFD060;--teal:#00E5CC;
  --red:#FF2952;--green:#28D970;--amber:#FF9A1F;--blue:#3D8EF0;
  --text:#EEECff;--sub:#6A6A9E;--muted:#2A2A52;
  --f:'Rajdhani',sans-serif;--mono:'Share Tech Mono',monospace;
  --gG:0 0 28px rgba(244,185,66,.45),0 0 60px rgba(244,185,66,.12);
  --gT:0 0 28px rgba(0,229,204,.45),0 0 60px rgba(0,229,204,.12);
  --gR:0 0 28px rgba(255,41,82,.5),0 0 60px rgba(255,41,82,.15);
  --gGr:0 0 28px rgba(40,217,112,.45),0 0 60px rgba(40,217,112,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--text);min-height:100dvh;
  background-image:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(30,20,80,.35) 0%,transparent 70%)}
#app{max-width:440px;margin:0 auto;padding:14px 16px 44px;position:relative}
button{font-family:var(--f);cursor:pointer;border:none;outline:none}
input{font-family:var(--f);outline:none}

/* ─── BUTTONS ─── */
.btn{
  border-radius:999px;padding:16px 36px;color:#000;
  font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  background:linear-gradient(135deg,var(--goldb),var(--gold));
  border:none;transition:transform .12s,box-shadow .2s;
  width:100%;max-width:320px;box-shadow:var(--gG);font-family:var(--f)
}
.btn:active{transform:scale(.94)}.btn:disabled{opacity:.28;box-shadow:none}
.btn-blue{background:linear-gradient(135deg,#5AABFF,var(--blue));color:#fff;box-shadow:0 0 28px rgba(61,142,240,.45)}
.btn-green{background:linear-gradient(135deg,#40FF88,var(--green));color:#000;box-shadow:var(--gGr)}
.btn-red{background:linear-gradient(135deg,#FF5070,var(--red));color:#fff;box-shadow:var(--gR)}
.btn2{
  border-radius:999px;padding:10px 22px;
  color:var(--sub);font-size:13px;font-weight:600;
  background:var(--raised);border:1px solid var(--border);
  font-family:var(--f);transition:transform .1s
}
.btn2:active{transform:scale(.96)}

/* ─── INPUTS ─── */
.inp{
  font-size:16px;color:var(--text);background:var(--raised);
  border:2px solid var(--border);border-radius:999px;
  padding:14px 22px;text-align:center;width:100%;font-weight:700;
  font-family:var(--f)
}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(244,185,66,.1)}

/* ─── CARDS ─── */
.cd{border-radius:22px;background:var(--surf);border:1px solid var(--border);padding:16px}
.ct{text-align:center}
.lb{font-size:10px;color:var(--sub);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-weight:600}

/* ─── DISPLAY ─── */
.dsp{font-family:var(--mono);color:var(--teal);text-shadow:0 0 20px rgba(0,229,204,.4)}

/* ─── ANIMATIONS ─── */
@keyframes pop{0%{transform:scale(.25);opacity:0}60%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slideIn{0%{transform:translateY(18px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes splashFade{0%{opacity:1}76%{opacity:1}100%{opacity:0;pointer-events:none}}
@keyframes spinR{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@keyframes sHand{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes goldPulse{0%,100%{box-shadow:0 0 26px rgba(244,185,66,.35),0 6px 40px rgba(0,0,0,.7)}50%{box-shadow:0 0 70px rgba(244,185,66,.9),0 0 140px rgba(244,185,66,.2),0 6px 40px rgba(0,0,0,.7)}}
@keyframes redPulse{0%,100%{box-shadow:0 0 26px rgba(255,41,82,.4),0 6px 40px rgba(0,0,0,.7)}50%{box-shadow:0 0 70px rgba(255,41,82,.95),0 0 140px rgba(255,41,82,.2),0 6px 40px rgba(0,0,0,.7)}}
@keyframes greenPulse{0%,100%{box-shadow:0 0 26px rgba(40,217,112,.4),0 6px 40px rgba(0,0,0,.7)}50%{box-shadow:0 0 80px rgba(40,217,112,1),0 0 150px rgba(40,217,112,.25),0 6px 40px rgba(0,0,0,.7)}}
@keyframes ringExpand{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}
@keyframes tickFlash{0%,100%{opacity:.3}50%{opacity:1}}
</style></head><body>

<!-- ═══ SPLASH — Animated Stopwatch ═══ -->
<div id="splash" style="position:fixed;inset:0;background:#06060E;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:splashFade 2.6s ease forwards;background-image:radial-gradient(ellipse 70% 50% at 50% 30%,rgba(40,20,100,.5) 0%,transparent 70%)">

  <!-- Stopwatch body -->
  <div style="position:relative;width:140px;height:165px;margin-bottom:26px">
    <!-- Crown button (top) -->
    <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:18px;background:linear-gradient(180deg,#FFE080,#F4B942);border-radius:8px 8px 4px 4px;box-shadow:0 0 18px rgba(244,185,66,.6)"></div>
    <!-- Start/stop pusher (right side) -->
    <div style="position:absolute;top:36px;right:-2px;width:10px;height:22px;background:linear-gradient(180deg,#2A2A50,#161630);border-radius:0 6px 6px 0;border:1px solid #22224A"></div>
    <!-- Lug left -->
    <div style="position:absolute;top:18px;left:8px;width:24px;height:8px;background:linear-gradient(90deg,#161630,#0D0D1E);border-radius:4px;transform:rotate(-18deg);border:1px solid #22224A"></div>
    <!-- Lug right -->
    <div style="position:absolute;top:18px;right:8px;width:24px;height:8px;background:linear-gradient(-90deg,#161630,#0D0D1E);border-radius:4px;transform:rotate(18deg);border:1px solid #22224A"></div>

    <!-- Outer bezel -->
    <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:130px;height:130px;border-radius:50%;background:linear-gradient(145deg,#1E1E40,#0A0A18);border:3px solid #F4B942;box-shadow:0 0 50px rgba(244,185,66,.4),0 0 0 6px rgba(244,185,66,.06),inset 0 0 30px rgba(0,0,0,.7)">

      <!-- Bezel tick marks (using box-shadow trick via multiple divs) -->
      <div style="position:absolute;top:4px;left:50%;width:4px;height:12px;background:#F4B942;transform:translateX(-50%);border-radius:2px;box-shadow:0 0 8px rgba(244,185,66,.7)"></div>
      <div style="position:absolute;right:4px;top:50%;width:12px;height:4px;background:#F4B942;transform:translateY(-50%);border-radius:2px"></div>
      <div style="position:absolute;bottom:4px;left:50%;width:4px;height:12px;background:#F4B942;transform:translateX(-50%);border-radius:2px"></div>
      <div style="position:absolute;left:4px;top:50%;width:12px;height:4px;background:#F4B942;transform:translateY(-50%);border-radius:2px"></div>
      <!-- Diagonal ticks -->
      <div style="position:absolute;top:11px;left:20px;width:3px;height:7px;background:#22224A;border-radius:2px;transform:rotate(-45deg)"></div>
      <div style="position:absolute;top:11px;right:20px;width:3px;height:7px;background:#22224A;border-radius:2px;transform:rotate(45deg)"></div>
      <div style="position:absolute;bottom:11px;left:20px;width:3px;height:7px;background:#22224A;border-radius:2px;transform:rotate(45deg)"></div>
      <div style="position:absolute;bottom:11px;right:20px;width:3px;height:7px;background:#22224A;border-radius:2px;transform:rotate(-45deg)"></div>

      <!-- Face -->
      <div style="position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#0F0F28,#060610);border:1px solid #22224A;display:flex;align-items:center;justify-content:center;overflow:hidden">
        <!-- Hour hand -->
        <div style="position:absolute;bottom:50%;left:50%;width:5px;height:26px;background:linear-gradient(0deg,var(--text),#A0A0CC);transform-origin:bottom center;transform:translateX(-50%) rotate(120deg);border-radius:3px 3px 0 0"></div>
        <!-- Minute hand -->
        <div style="position:absolute;bottom:50%;left:50%;width:3px;height:36px;background:linear-gradient(0deg,var(--text),#C0C0E0);transform-origin:bottom center;transform:translateX(-50%) rotate(-50deg);border-radius:2px 2px 0 0"></div>
        <!-- Counterweight tail -->
        <div style="position:absolute;top:50%;left:50%;width:3px;height:12px;background:#F4B942;opacity:.6;transform-origin:top center;transform:translateX(-50%)"></div>
        <!-- Second hand — ANIMATED -->
        <div style="position:absolute;bottom:50%;left:50%;width:2px;height:44px;background:linear-gradient(0deg,transparent 0%,#F4B942 30%);transform-origin:bottom center;transform:translateX(-50%);border-radius:2px;animation:sHand 2s steps(60) infinite;box-shadow:0 0 10px rgba(244,185,66,.9)"></div>
        <!-- Center cap -->
        <div style="width:11px;height:11px;border-radius:50%;background:radial-gradient(circle,#FFE080,#F4B942);z-index:4;box-shadow:0 0 14px rgba(244,185,66,1)"></div>
      </div>
    </div>
  </div>

  <div style="font-family:'Share Tech Mono',monospace;font-size:30px;font-weight:400;color:#F4B942;letter-spacing:8px;text-shadow:0 0 30px rgba(244,185,66,.5)">TIMETAP</div>
  <div style="font-size:10px;color:#6A6A9E;margin-top:7px;letter-spacing:6px;font-family:var(--f)">PARTY GAME</div>
  <div style="margin-top:30px;width:28px;height:28px;border:2px solid #22224A;border-top-color:#F4B942;border-radius:50%;animation:spinR 1s linear infinite"></div>
</div>

<div id="app"></div>

<script>
/* ── AUDIO ── */
var actx=null;function initAudio(){if(!actx)try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function sfx(f,d,t,v){initAudio();if(!actx)return;try{var o=actx.createOscillator(),g=actx.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=v||.2;g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function sfxTick(){sfx(600,.06,"sine",.3)}
function sfxGo(){sfx(440,.15,"sine",.3);setTimeout(function(){sfx(554,.15,"sine",.3)},100);setTimeout(function(){sfx(660,.25,"sine",.35)},200)}
function sfxStop(){sfx(330,.4,"square",.25);setTimeout(function(){sfx(220,.4,"square",.2)},120)}
function sfxGood(){sfx(660,.12,"sine",.3);setTimeout(function(){sfx(880,.18,"sine",.3)},100)}
function sfxBad(){sfx(180,.4,"sawtooth",.2)}
function sfxElim(){sfx(440,.3,"square",.2);setTimeout(function(){sfx(330,.3,"square",.2)},200);setTimeout(function(){sfx(220,.5,"square",.25)},400)}
function sfxWin(){sfx(523,.15,"sine",.3);setTimeout(function(){sfx(659,.15)},120);setTimeout(function(){sfx(784,.15)},240);setTimeout(function(){sfx(1047,.3)},360)}
function vb(p){try{navigator.vibrate(p)}catch(e){}}

/* ── SOCKET & STATE ── */
var so=io(location.origin,{reconnection:true,reconnectionAttempts:30});
var myId=null,room=null,myName="",myAvatar="😎",selFormat="ffa";
var AV=["😎","🔥","⚡","🎯","💀","👾","🤖","🎮","🦊","🐸","🌟","💎","🎪","🎭","🃏","🧨"];
var MI={
  bullseye:{name:"Bullseye",icon:"🎯",color:"#F4B942",desc:"START drücken, Zielzeit im Kopf zählen, STOPP drücken."},
  timesense:{name:"Zeitgefühl",icon:"🧠",color:"#3D8EF0",desc:"Buzzer wird grün = zählen! Die App stoppt automatisch."},
  memory:{name:"Memory",icon:"💾",color:"#28D970",desc:"Zahl blitzt kurz auf. Merken und eingeben!"},
  reaction:{name:"Reaktion",icon:"⚡",color:"#FF9A1F",desc:"10 Buzzer. Einer wird grün. Sofort drücken!"}
};
var SEGS=[{id:"bullseye",color:"#F4B942"},{id:"timesense",color:"#3D8EF0"},{id:"memory",color:"#28D970"},{id:"reaction",color:"#FF9A1F"}];

function $(id){return document.getElementById(id)}
function fullClientReset(){clearTimeout(window._tsWait);clearTimeout(window._rt);window._bs=null;window._rs=null;window._tbs=null;submitted=false;lastRound=0;lastPhase="";lastTeamSubCount=0}
setTimeout(function(){var s=$("splash");if(s)s.style.display="none";home()},2600);
so.on("connect",function(){myId=so.id});
var lastPhase="",lastRound=0,submitted=false,lastTeamSubCount=0;

so.on("sync",function(data){room=data;
  if(room.phase==="playing"&&room.currentRound!==lastRound){submitted=false;lastRound=room.currentRound}
  if(room.phase==="playing"&&submitted){renderWaiting();lastPhase=room.phase;return}
  var tsC=room.teamSubs?Object.keys(room.teamSubs).length:0;var tCh=room.roundData&&room.roundData.teamMode&&tsC!==lastTeamSubCount;if(tCh)lastTeamSubCount=tsC;
  if(room.phase==="playing"&&lastPhase==="playing"&&!submitted&&!tCh)return;
  if(room.phase===lastPhase&&(room.phase==="results"||room.phase==="gameover"||room.phase==="pregame"||room.phase==="elimination"||room.phase==="spin"))return;
  lastPhase=room.phase;render()});
so.on("zeitStop",function(d){if(submitted||!room||room.phase!=="playing"||room.mode!=="timesense")return;window._zeitActual=d.actual;sfxStop();vb([80,30,80]);renderZeitInput()});

function render(){if(!room)return;switch(room.phase){case"lobby":renderLobby();break;case"pregame":renderPreGame();break;case"spin":renderSpin();break;case"playing":renderPlaying();break;case"results":renderResults();break;case"elimination":renderElimination();break;case"gameover":renderGameOver();break}}

/* ══ HOME ══ */
function home(){so.emit("leave");room=null;fullClientReset();
$("app").innerHTML=
'<div style="animation:up .55s ease;padding-top:16px">'+
'<div class="ct" style="margin-bottom:38px">'+
  '<div style="font-family:\'Share Tech Mono\',monospace;font-size:28px;color:#F4B942;letter-spacing:8px;text-shadow:0 0 28px rgba(244,185,66,.45)">TIMETAP</div>'+
  '<div style="font-size:10px;color:#6A6A9E;letter-spacing:5px;margin-top:6px">PARTY GAME</div>'+
'</div>'+
'<div style="display:flex;flex-direction:column;gap:16px;align-items:center">'+

  /* ── All vs All button ── */
  '<button onclick="initAudio();selFormat=\'ffa\';setupRoom()" style="width:100%;padding:22px 24px;display:flex;align-items:center;gap:20px;text-align:left;border-radius:24px;border:1px solid #22224A;color:#EEECff;background:#0D0D1E;box-shadow:0 6px 30px rgba(0,0,0,.6);cursor:pointer;font-family:\'Rajdhani\',sans-serif;transition:border-color .2s,box-shadow .2s">'+
    '<div style="position:relative;flex-shrink:0;width:64px;height:64px">'+
      '<div style="position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#FFE080,#F4B942);box-shadow:0 0 30px rgba(244,185,66,.55)"></div>'+
      '<div style="position:absolute;inset:3px;border-radius:50%;background:#0D0D1E;display:flex;align-items:center;justify-content:center;font-size:26px">⚔️</div>'+
    '</div>'+
    '<div><div style="font-size:19px;font-weight:700;letter-spacing:.5px">Alle gegen Alle</div><div style="font-size:13px;color:#6A6A9E;margin-top:3px;font-weight:600">Elimination bis zum Sieger</div></div>'+
  '</button>'+

  /* ── Team vs Team button ── */
  '<button onclick="initAudio();selFormat=\'teams\';setupRoom()" style="width:100%;padding:22px 24px;display:flex;align-items:center;gap:20px;text-align:left;border-radius:24px;border:1px solid #22224A;color:#EEECff;background:#0D0D1E;box-shadow:0 6px 30px rgba(0,0,0,.6);cursor:pointer;font-family:\'Rajdhani\',sans-serif">'+
    '<div style="position:relative;flex-shrink:0;width:64px;height:64px">'+
      '<div style="position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#6BC0FF,#3D8EF0);box-shadow:0 0 28px rgba(61,142,240,.5)"></div>'+
      '<div style="position:absolute;inset:3px;border-radius:50%;background:#0D0D1E;display:flex;align-items:center;justify-content:center;font-size:26px">🤝</div>'+
    '</div>'+
    '<div><div style="font-size:19px;font-weight:700;letter-spacing:.5px">Team vs Team</div><div style="font-size:13px;color:#6A6A9E;margin-top:3px;font-weight:600">Gemeinsam gewinnen</div></div>'+
  '</button>'+

'</div></div>';}

/* ══ SETUP ══ */
function setupRoom(){
$("app").innerHTML=
'<div style="animation:up .4s ease">'+
'<button class="btn2" onclick="home()">← Zurück</button>'+
'<div class="ct" style="margin:20px 0"><div style="font-family:\'Share Tech Mono\',monospace;font-size:16px;color:#EEECff;letter-spacing:3px">SPIELER-INFO</div></div>'+
'<div class="cd" style="margin-bottom:16px">'+
  '<div class="lb">Name</div>'+
  '<input id="nm" class="inp" placeholder="Name" maxlength="12" value="'+myName+'">'+
  '<div class="lb" style="margin-top:18px">Avatar</div>'+
  '<div id="avs" style="display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:10px"></div>'+
'</div>'+
'<div id="err" style="font-size:13px;color:#FF2952;margin-bottom:14px;text-align:center;font-weight:600"></div>'+
'<div style="display:flex;gap:28px;justify-content:center">'+
  '<div class="ct">'+
    '<button onclick="doCreate()" style="width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#FFE080,#F4B942);font-size:30px;color:#000;display:flex;align-items:center;justify-content:center;border:none;box-shadow:0 0 32px rgba(244,185,66,.55);cursor:pointer">+</button>'+
    '<div style="font-size:11px;color:#6A6A9E;margin-top:9px;font-weight:600;letter-spacing:1px">ERSTELLEN</div>'+
  '</div>'+
  '<div class="ct">'+
    '<button onclick="joinScreen()" style="width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#6BC0FF,#3D8EF0);font-size:28px;color:#fff;display:flex;align-items:center;justify-content:center;border:none;box-shadow:0 0 28px rgba(61,142,240,.45);cursor:pointer">→</button>'+
    '<div style="font-size:11px;color:#6A6A9E;margin-top:9px;font-weight:600;letter-spacing:1px">BEITRETEN</div>'+
  '</div>'+
'</div></div>';
renderAvatars()}

function renderAvatars(){var g=$("avs");if(!g)return;
g.innerHTML=AV.map(function(a){
  var sel=myAvatar===a;
  return'<div onclick="myAvatar=\''+a+'\';renderAvatars()" style="width:46px;height:46px;font-size:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:'+(sel?"2px solid #F4B942":"1px solid #22224A")+';background:'+(sel?"rgba(244,185,66,.1)":"#161630")+';cursor:pointer;transition:all .15s;box-shadow:'+(sel?"0 0 16px rgba(244,185,66,.4)":"none")+'">'+a+'</div>'
}).join("")}

function doCreate(){var n=$("nm");if(!n||!n.value.trim()){$("err").textContent="Name eingeben!";return}myName=n.value.trim();fullClientReset();so.emit("create",{name:myName,avatar:myAvatar,format:selFormat,roundsPerPhase:3},function(r){if(!r.ok)$("err").textContent=r.err})}

function joinScreen(){var n=$("nm");if(!n||!n.value.trim()){$("err").textContent="Name eingeben!";return}myName=n.value.trim();
$("app").innerHTML=
'<div class="ct" style="animation:up .4s ease;padding-top:32px">'+
'<div style="position:relative;width:72px;height:72px;margin:0 auto 20px">'+
  '<div style="position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#FFE080,#F4B942);box-shadow:0 0 32px rgba(244,185,66,.55)"></div>'+
  '<div style="position:absolute;inset:3px;border-radius:50%;background:#0D0D1E;display:flex;align-items:center;justify-content:center;font-size:28px">🔑</div>'+
'</div>'+
'<div style="font-family:\'Share Tech Mono\',monospace;font-size:16px;color:#EEECff;letter-spacing:3px;margin-bottom:22px">BEITRETEN</div>'+
'<input id="ji" class="inp" placeholder="CODE" maxlength="4" style="font-family:\'Share Tech Mono\',monospace;letter-spacing:12px;font-size:24px;margin-bottom:14px;max-width:240px" oninput="this.value=this.value.toUpperCase()">'+
'<div id="jerr" style="font-size:13px;color:#FF2952;margin-bottom:14px;font-weight:600"></div>'+
'<button class="btn btn-blue" onclick="doJoin()">Beitreten</button><br>'+
'<button class="btn2" style="margin-top:18px" onclick="setupRoom()">← Zurück</button></div>'}

function doJoin(){var c=$("ji");if(!c||c.value.length<4){$("jerr").textContent="4-stelliger Code!";return}fullClientReset();so.emit("join",{code:c.value,name:myName,avatar:myAvatar},function(r){if(!r.ok)$("jerr").textContent=r.err})}

/* ══ LOBBY ══ */
function renderLobby(){var isHost=room.hostId===room.myId,ps=room.players||[];
var html=
'<div style="animation:up .4s ease">'+
'<div class="ct" style="margin-bottom:22px">'+
  '<button onclick="try{navigator.clipboard.writeText(\''+room.code+'\')}catch(e){}" '+

  svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x1+'" y2="'+y1+'" stroke="#06060E" stroke-width="4"/>';
  var midA=(a1+a2)/2,ir=64;

'<div style="animation:pop .4s ease">'+

function zeitSub(){var el=$("tI");if(!el)return;var g=parseFloat(el.value);if(isNaN(g)||g<=0)return;

'<div style="font-size:20px;font-weight:700;color:'+rc+';letter-spacing:2px">'+rt+'</div>'+

/* ══ MEMORY ══ */
function renderMemory(hdr){
$("app").innerHTML=
'<div style="animation:up .3s ease">'+hdr+
'<div class="cd" style="padding:30px"><div class="ct" id="mC">'+

'</div></div></div>'}

function startMemory(){
var shown=room.roundData.shownTime;var dur=room.roundData.showDuration||300;var dec=room.roundData.decimals||3;
sfxTick();vb(40);var mc=$("mC");if(!mc)return;
mc.innerHTML=
'<div style="animation:pop .18s ease">'+
'<div style="font-size:10px;color:#FF2952;letter-spacing:4px;margin-bottom:18px;font-weight:600;animation:tickFlash .3s ease infinite">JETZT MERKEN!</div>'+
'<div class="dsp" style="font-size:52px;margin:0 0 6px">'+shown.toFixed(dec)+'<span style="font-size:18px;color:#6A6A9E">s</span></div>'+
'</div>';
setTimeout(function(){
  var mc2=$("mC");if(!mc2)return;sfxStop();vb(40);
  mc2.innerHTML=
  '<div style="animation:up .4s ease">'+
  '<div class="lb" style="margin-bottom:18px">Was war die Zahl?</div>'+
  '<div style="font-size:40px;margin:0 0 18px">🤔</div>'+
  '<div style="max-width:210px;margin:0 auto 18px"><input id="mI" class="inp" style="font-family:\'Share Tech Mono\',monospace;font-size:22px" placeholder="z.B. 3.456" inputmode="decimal"></div>'+
  '<button class="btn btn-green" onclick="memSub()">Bestätigen</button></div>';
  setTimeout(function(){var i=$("mI");if(i)i.focus()},100)
},dur)}

function memSub(){var el=$("mI");if(!el)return;var g=parseFloat(el.value);if(isNaN(g))return;
var shown=room.roundData.shownTime;var dec=room.roundData.decimals||3;var dev=Math.abs(g-shown);var devS=parseFloat(dev.toFixed(1));
if(dev<.05){sfxGood();vb([40,20,40])}else{sfxBad();vb(60)}
var rc=dev<.05?"#28D970":dev<.3?"#F4B942":"#FF2952";
var mc=$("mC");
if(mc)mc.innerHTML=
'<div style="animation:pop .35s ease">'+
'<div style="font-size:13px;color:#6A6A9E;margin-bottom:5px;font-weight:600">Tipp: <span class="dsp" style="font-size:15px">'+g.toFixed(dec)+'s</span></div>'+
'<div style="font-size:13px;color:#6A6A9E;margin-bottom:14px;font-weight:600">Richtig: <span style="font-family:\'Share Tech Mono\',monospace;color:#F4B942;font-size:15px">'+shown.toFixed(dec)+'s</span></div>'+
'<div style="font-size:20px;font-weight:700;color:'+rc+';letter-spacing:2px">'+devS+'s Abweichung</div></div>';
doSubmit(devS)}

/* ══ REACTION ══ */
function renderReaction(hdr){var gIdx=room.roundData.greenIdx;
var bhtml='';
for(var i=0;i<10;i++){
  bhtml+='<div id="rz'+i+'" onclick="rzTap('+i+')" '+
    'style="width:56px;height:56px;border-radius:50%;'+
    'background:radial-gradient(circle at 35% 30%,#220610,#100206);'+
    'border:2px solid #FF2952;display:flex;align-items:center;justify-content:center;'+
    'cursor:pointer;box-shadow:0 0 10px rgba(255,41,82,.15);'+
    'transition:all .15s;user-select:none;'+
    'font-family:\'Share Tech Mono\',monospace;font-size:11px;color:rgba(255,41,82,.4)">'+
    (i+1)+'</div>';
}
$("app").innerHTML=
'<div style="animation:up .3s ease">'+hdr+
'<div class="cd" style="padding:22px"><div class="ct">'+
'<div style="font-size:13px;color:#6A6A9E;margin-bottom:22px;font-weight:600;letter-spacing:1px">Warte auf GRÜN!</div>'+
'<div id="rzGrid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:11px;max-width:330px;margin:0 auto">'+bhtml+'</div>'+
'<div id="rzSub" style="font-size:12px;color:#6A6A9E;margin-top:20px;font-weight:600">Nicht zu früh!</div>'+
'</div></div></div>';
window._rs="ready";window._rGreen=gIdx;
window._rt=setTimeout(function(){
  if(!room||room.phase!=="playing")return;
  window._rs="go";window._r0=performance.now();sfxGo();vb([80,30,80,30,120]);
  var gz=$("rz"+gIdx);if(!gz)return;
  gz.style.background="radial-gradient(circle at 35% 30%,#062816,#02100A)";
  gz.style.borderColor="#28D970";gz.style.color="#28D970";
  gz.style.boxShadow="0 0 40px rgba(40,217,112,.85),0 0 80px rgba(40,217,112,.3)";
  gz.style.animation="greenPulse 0.65s ease infinite";
  gz.style.transform="scale(1.08)";
  var s=$("rzSub");if(s){s.style.color="#28D970";s.textContent="Grünen drücken!"}
},2000+Math.random()*4000)}

function rzTap(idx){
if(window._rs==="ready"){
  clearTimeout(window._rt);window._rs="early";sfxBad();vb(80);
  var b=$("rz"+idx);if(b){b.style.background="#1A1A30";b.style.borderColor="#6A6A9E";b.style.color="#6A6A9E";b.style.animation="none";b.style.boxShadow="none"}
  var s=$("rzSub");if(s)s.innerHTML='<div style="color:#FF2952;font-weight:700;font-size:14px;letter-spacing:1px;margin-bottom:14px">ZU FRÜH! 5s Strafe</div><button class="btn" style="max-width:200px" onclick="doSubmit(5)">Weiter</button>';
}else if(window._rs==="go"){
  window._rs="done";
  if(idx!==window._rGreen){sfxBad();vb(80);var s2=$("rzSub");if(s2)s2.innerHTML='<div style="color:#FF2952;font-weight:700;letter-spacing:1px">Falscher Buzzer! 5s</div>';doSubmit(5);return}
  var rt=(performance.now()-window._r0)/1000;var rtS=parseFloat(rt.toFixed(1));
  if(rt<.25){sfxGood();vb([40,20,40])}else{sfxBad();vb(60)}
  var b2=$("rz"+idx);if(b2){b2.style.background="radial-gradient(circle at 35% 30%,#252548,#0D0D1E)";b2.style.borderColor="#F4B942";b2.style.color="#F4B942";b2.style.animation="none";b2.style.boxShadow="0 0 22px rgba(244,185,66,.5)";b2.style.transform="scale(1)"}
  var rc=rt<.2?"#28D970":rt<.35?"#F4B942":"#FF2952";
  var rt2=rt<.2?"BLITZ!":rt<.35?"SCHNELL!":"LANGSAM!";
  var s3=$("rzSub");if(s3)s3.innerHTML='<div class="dsp" style="font-size:34px;margin-bottom:6px">'+rt.toFixed(2)+'s</div><div style="font-size:13px;font-weight:700;color:'+rc+';letter-spacing:2px">'+rt2+'</div>';
  doSubmit(rtS);
}}

function renderGameOver(){submitted=false;sfxWin();vb([50,30,50,30,50,30,100]);
var sc=room.finalScores||{};var sorted=Object.entries(sc).sort(function(a,b){return b[1]-a[1]});var isHost=room.hostId===room.myId;
var winner=room.players.find(function(p){return!p.eliminated&&p.connected});

'<div style="animation:pop .5s ease">'+
'<div class="ct" style="margin-bottom:28px">'+
'<div style="font-size:66px;animation:float 2s ease infinite;filter:drop-shadow(0 0 28px rgba(244,185,66,.6)) drop-shadow(0 0 60px rgba(244,185,66,.2))">🏆</div>'+
(winner?'<div style="font-size:46px;margin-top:6px">'+winner.avatar+'</div>'+
'<div style="font-family:\'Share Tech Mono\',monospace;font-size:14px;color:#F4B942;margin-top:10px;letter-spacing:3px;text-shadow:0 0 22px rgba(244,185,66,.5)">'+winner.name.toUpperCase()+' GEWINNT!</div>':
'<div style="font-family:\'Share Tech Mono\',monospace;font-size:16px;color:#F4B942;margin-top:12px;letter-spacing:4px">SPIEL VORBEI</div>')+

'<div class="cd" style="margin-bottom:22px">';

  var pid=e[0],pts=e[1];var p=room.players.find(function(x){return x.id===pid});if(!p)return;
  var medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1);var isW=i===0;
  html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:'+(isW?"18px 6px":"12px 6px")+';border-bottom:'+(i<sorted.length-1?"1px solid #161630":"none")+';animation:slideIn .4s ease '+(i*.1)+'s both'+(isW?';background:rgba(244,185,66,.04);border-radius:14px':'')+'">';
  html+='<div style="display:flex;align-items:center;gap:11px"><span style="font-size:'+(isW?'23':'17')+'px;width:28px">'+medal+'</span>';
  html+='<div style="width:'+(isW?52:40)+'px;height:'+(isW?52:40)+'px;border-radius:50%;background:#161630;border:2px solid '+(isW?"#F4B942":"#22224A")+';display:flex;align-items:center;justify-content:center;font-size:'+(isW?28:20)+'px;box-shadow:'+(isW?"0 0 24px rgba(244,185,66,.45)":"none")+'">'+p.avatar+'</div>';

});
html+='</div>';
if(isHost)html+='<div class="ct" style="margin-bottom:14px"><button class="btn" onclick="so.emit(\'playAgain\')">Nochmal</button></div>';
html+='<div class="ct"><button class="btn2" onclick="home()">← Startseite</button></div></div>';
$("app").innerHTML=html}
