function winner(data){confetti();$("app").innerHTML='<div class="ct" style="animation:pop .5s ease;padding-top:30px"><div style="font-size:60px;animation:float 2s ease infinite;margin-bottom:8px">🏆</div><div style="font-size:28px;font-weight:900;background:linear-gradient(135deg,'+A.am+',#FBBF24);-webkit-background-clip:text;-webkit-text-fill-color:transparent">'+data.winner+'</div><div style="font-size:12px;color:'+T.sb+';margin-top:4px">'+t("winsTrn")+'</div><button class="btn" style="margin-top:24px" onclick="home()">'+t("home")+'</button></div>';sfxWin();vb([25,40,25,40,70])}
