// ══════════════════════════════════════════════════════
// PARTY MODE — CLEAN STATE MACHINE
// ══════════════════════════════════════════════════════
//
// States: LOBBY → ROUND_START → PLAYER_PASS → PLAYER_WAGER
//       → PLAYER_SABOTAGE → PLAYER_PLAY → PLAYER_RESULT
//       → ROUND_REVEAL → DARE → ROUND_START (loop) → GAME_END
//
// All state transitions go through partySetState(newState)
// No direct function chains. No skipping.
// ══════════════════════════════════════════════════════

var P={
  state:"",          // current state
  players:[],        // [{name,avatar}]
  totalRnds:5,
  daresOn:true,
  round:0,           // current round 1-based
  mode:null,         // "classic"|"reflex"|"blind"|"zeit"
  target:0,          // target time for this round
  ci:0,              // current player index
  scores:[],         // cumulative scores per player
  cards:[],          // sabotage cards per player [[card,card],...]
  wager:0,           // current player's wager
  sab:null,          // active sabotage card
  results:[],        // this round's results [{idx,name,avatar,ms,score,wager,final,revenge}]
  crownIdx:-1,       // who has the crown
  lastPlaceIdx:-1,   // who was last place last round (gets 2x)
  dareLoser:null     // who spins the dare wheel
};

var PARTY_MODES=["classic","reflex","blind","zeit"];
var PARTY_MODE_IC={classic:"\uD83C\uDFAF",reflex:"\u26A1",blind:"\uD83D\uDE48",zeit:"\uD83E\uDDE0"};
var PARTY_MODE_GR={classic:"linear-gradient(135deg,#10B981,#06B6D4)",reflex:"linear-gradient(135deg,#F97316,#F43F5E)",blind:"linear-gradient(135deg,#6366F1,#8B5CF6)",zeit:"linear-gradient(135deg,#8B5CF6,#EC4899)"};

// ═══ STATE MACHINE ═══
function partySetState(newState){
  P.state=newState;
  switch(newState){
    case "LOBBY": renderPartyLobby(); break;
    case "ROUND_START": renderRoundStart(); break;
    case "PLAYER_PASS": renderPlayerPass(); break;
    case "PLAYER_WAGER": renderPlayerWager(); break;
    case "PLAYER_SABOTAGE": renderPlayerSabotage(); break;
    case "PLAYER_PLAY": renderPlayerPlay(); break;
    case "PLAYER_RESULT": renderPlayerResult(); break;
    case "ROUND_REVEAL": renderRoundReveal(); break;
    case "DARE": renderDare(); break;
    case "GAME_END": renderGameEnd(); break;
  }
}

// ═══ SCORING ═══
function partyScore(diffMs){return Math.max(0,1000-diffMs)}
function partyTier(diffMs){
  if(diffMs<=150)return{label:t("perf"),icon:"\u2B50",color:A.am,tier:"PERFECT"};
  if(diffMs<=300)return{label:t("strong"),icon:"\uD83D\uDD25",color:A.em,tier:"GOOD"};
  return{label:t("miss"),icon:"\uD83D\uDCA8",color:A.ro,tier:"FAIL"}
}
function partyGenTarget(){return Math.round((1.5+Math.random()*3.5)*10)/10}
function partyZeitTarget(){return Math.round((2+Math.random()*4)*10)/10}

// ═══ CROWN BAR (always visible during game) ═══
function pCrown(){
  var h='<div style="display:flex;gap:4px;padding:6px 0;overflow-x:auto;margin-bottom:10px;justify-content:center">';
  P.players.forEach(function(p,i){
    h+='<div style="display:flex;flex-direction:column;align-items:center;min-width:44px;position:relative;opacity:'+(i===P.ci&&P.state!=="ROUND_REVEAL"&&P.state!=="DARE"?'1':'.5')+'">';
    if(P.crownIdx===i)h+='<div style="font-size:12px;animation:crownBob 1.5s ease infinite;position:absolute;top:-14px">\uD83D\uDC51</div>';
    h+='<div style="font-size:20px;margin-top:'+(P.crownIdx===i?'4':'0')+'px">'+p.avatar+'</div>';
    h+='<div style="font-size:9px;font-weight:700;color:'+T.tx+';font-family:monospace">'+(P.scores[i]||0)+'</div>';
    h+='</div>'
  });
  return h+'</div>'
}

// ═══ STATE: LOBBY ═══
function renderPartyLobby(){
  P.players=[];P.round=0;P.totalRnds=5;P.daresOn=true;P.crownIdx=-1;P.lastPlaceIdx=-1;
  window._pav=AV[0];
  $("app").innerHTML='<div style="animation:up .4s ease">'+
  '<button class="btn2" onclick="home()">\u2190 '+t("back")+'</button>'+
  '<div class="ct" style="margin:12px 0"><div style="font-size:36px">\uD83C\uDF89</div><div style="font-size:20px;font-weight:900;color:'+T.tx+'">'+t("party")+'</div><div style="font-size:12px;color:'+T.sb+'">'+t("partyD")+'</div></div>'+
  '<div style="'+cds("padding:14px 16px;margin-bottom:12px")+'">'+
  '<input id="pn" placeholder="'+t("name")+'" maxlength="10" onkeydown="if(event.key===\'Enter\')pAddPlayer()" style="width:100%;background:transparent;border:none;border-bottom:2px solid '+T.ln+';padding:8px 0;color:'+T.tx+';font-size:16px;font-weight:800;text-align:center">'+
  '<div id="pav" style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center"></div>'+
  '<div class="ct" style="margin-top:10px"><button onclick="pAddPlayer()" style="background:linear-gradient(135deg,'+A.em+','+A.cy+');border:none;border-radius:10px;padding:10px 18px;color:#fff;font-size:13px;font-weight:600">'+t("addP")+'</button></div></div>'+
  '<div id="plist" style="'+cds("padding:12px;margin-bottom:12px")+'"></div>'+
  '<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px">'+
  '<span style="font-size:12px;color:'+T.sb+'">'+t("rnds")+':</span>'+

  window._pBS="ready";window._pT0=0
}
function pClassicTap(){
  if(window._pBS==="ready"){
    window._pT0=Date.now();window._pBS="timing";
    $("bz").style.background="linear-gradient(135deg,"+A.or+","+A.ro+")";
    $("bz").style.boxShadow="0 0 24px "+A.ro+"30";
    $("bzl").textContent="STOP";vb(25)
  } else if(window._pBS==="timing"){
    var elapsed=Math.max(.01,(Date.now()-window._pT0)/1000);
    var isSpeed2=P.sab==="speed";
    var jitter=isSpeed2?(Math.random()-.5)*.6:0;
    var adj=Math.max(.01,elapsed+jitter);

    $("bz").style.background="linear-gradient(135deg,#5D5B7A,#555)";
    $("bz").style.boxShadow="none";$("bzl").textContent="\u2713";
    var diffMs=Math.round(Math.abs(adj-P.target)*1000);
    pFinishTurn(diffMs,adj)
  }
}

// ═══ FINISH TURN (central scoring) ═══
function pFinishTurn(diffMs,actualTime){
  var tier=partyTier(diffMs);
  var baseScore=partyScore(diffMs);
  var isRevenge=P.lastPlaceIdx===P.ci;
  if(isRevenge)baseScore=baseScore*2;

  var wagerResult=0;
  if(P.wager>0){
    if(tier.tier==="FAIL")wagerResult=-P.wager;
    else wagerResult=P.wager;
  }
  var finalScore=Math.max(0,baseScore+wagerResult);

  // Sound + haptic
  if(tier.tier==="PERFECT"){sfxGreat();vb([25,40,25,40,70])}
  else if(tier.tier==="GOOD"){sfxGood();vb(25)}
  else{sfxBad();vb(10)}

  // Store result
  P.results.push({
    idx:P.ci, name:P.players[P.ci].name, avatar:P.players[P.ci].avatar,
    diffMs:diffMs, baseScore:baseScore, wager:P.wager, wagerResult:wagerResult,
    finalScore:finalScore, revenge:isRevenge, sab:P.sab, tier:tier
  });

  // Show individual result
  setTimeout(function(){partySetState("PLAYER_RESULT")},400)
}

function pNextAfterResult(){
  sfxTap();
  if(P.ci<P.players.length-1){
    P.ci++;P.wager=0;P.sab=null;
    partySetState("PLAYER_PASS")
  } else {
    // All players done — update scores
    P.results.forEach(function(r){P.scores[r.idx]+=r.finalScore});
    // Update crown
    var maxS=Math.max.apply(null,P.scores);
    var newCrown=P.scores.indexOf(maxS);
    if(newCrown!==P.crownIdx){sfxCrown();P.crownIdx=newCrown}
    // Find last place for next round
    var minS=Math.min.apply(null,P.scores);
    P.lastPlaceIdx=P.scores.indexOf(minS);
    partySetState("ROUND_REVEAL")
  }
}

function renderRoundReveal(){
  sfxDrum();vb(25);
  var sorted=P.results.slice().sort(function(a,b){return b.finalScore-a.finalScore});
  var maxScore=Math.max.apply(null,sorted.map(function(r){return r.finalScore}).concat([1]));

  $("app").innerHTML='<div style="padding:20px 16px;animation:fadeIn .4s ease">'+
  '<div class="ct" style="margin-bottom:16px"><div style="font-size:12px;color:'+T.mt+';letter-spacing:3px;text-transform:uppercase">'+t("drumroll")+'</div>'+

  '<div id="rvb"></div></div>';

  // Reveal one by one: worst first, best last

        var w=Math.max(8,(r.finalScore/maxScore)*100);
        html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;opacity:'+(show?1:.12)+';transition:opacity .3s;'+(show?"animation:sL .3s ease both":"")+'">'+

        '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700;color:'+T.tx+';margin-bottom:3px">'+r.name+'</div>'+

      });

      sfxTick();vb(10);
      revealIdx++;
      if(revealIdx>=sorted.length){

// Persistent state
var onlineActive=false; // are we in online mode?
var lastRenderedStatus=""; // prevent unnecessary re-renders
var zeitCountdownActive=false;

// Save/load session for reconnect
function saveSession(code,name){try{sessionStorage.setItem("tt_code",code);sessionStorage.setItem("tt_name",name)}catch(e){}}
function clearSession(){try{sessionStorage.removeItem("tt_code");sessionStorage.removeItem("tt_name")}catch(e){}}
function getSession(){try{return{code:sessionStorage.getItem("tt_code"),name:sessionStorage.getItem("tt_name")}}catch(e){return{code:null,name:null}}}

// Try reconnect on page load
so.on("connect",function(){
  myId=so.id;
  document.getElementById("sd").style.background=A.em;
  var sess=getSession();
  if(sess.code&&sess.name){
    so.emit("rejoin",{code:sess.code,name:sess.name},function(r){
      if(r.ok){rc=r.code;myN=sess.name;onlineActive=true}
      else clearSession()
    })
  }
});
so.on("disconnect",function(){document.getElementById("sd").style.background=A.ro});

// ═══ THE SINGLE SYNC HANDLER ═══
// Server sends this on EVERY state change. Client renders based on status.
so.on("sync",function(s){
  st=s;
  // Update my host status
  var me=st.players.find(function(p){return p.id===myId});
  if(me)isH=me.host;
  // Only render if we're in online mode
  if(onlineActive)renderOnline();
});

// Individual events that need special handling
so.on("zeitStop",function(){
  zeitCountdownActive=false;
  if(onlineActive)renderZeitEstimate();
});
so.on("fakePrompt",function(d){if(onlineActive)renderFakePrompt(d.time)});
so.on("sabPrompt",function(d){if(onlineActive)renderSabPrompt(d.targets)});
so.on("tbReveal",function(d){if(onlineActive)renderTBReveal(d)});

// ═══ MASTER RENDER ═══
function renderOnline(){
  if(!st||!st.status)return;
  var s=st.status;
  // Don't re-render same status (except lobby which needs player list updates)
  if(s===lastRenderedStatus&&s!=="lobby"&&s!=="playing")return;
  lastRenderedStatus=s;

  if(s==="lobby")renderLobby();
  else if(s==="playing"){
    if(!zeitCountdownActive){
      if(st.mode==="zeit")renderZeitCountdown();
      else renderBuzzer();
    }
    // Check if I already submitted
    var me2=st.players.find(function(p){return p.id===myId});
    if(me2&&me2.submitted&&!zeitCountdownActive)renderWaiting();
  }
  else if(s==="hidden")renderWaiting();
  else if(s==="results")renderResults();
  else if(s==="voting")renderVoting();
  else if(s==="ended")renderWinner();
}

  ps.forEach(function(p,i){
    var disc=!p.connected?' style="opacity:.4"':'';
    html+='<div'+disc+' style="display:flex;align-items:center;gap:10px;padding:10px 0;'+(i<ps.length-1?'border-bottom:1px solid '+T.ln:'')+'">';
    html+='<span style="font-size:24px">'+(p.avatar||"\uD83D\uDE0E")+'</span>';
    html+='<span style="flex:1;font-weight:700;font-size:14px;color:'+T.tx+'">'+p.name;
    if(p.host)html+=' <span style="font-size:9px;color:'+A.am+';background:'+A.am+'20;padding:2px 6px;border-radius:4px">HOST</span>';
    if(p.id===myId)html+=' <span style="font-size:9px;color:'+A.v+';background:'+A.v+'20;padding:2px 6px;border-radius:4px">DU</span>';
    if(!p.connected)html+=' <span style="font-size:9px;color:'+A.ro+'">offline</span>';
    html+='</span></div>'
  });
  html+='</div>';

  html+='<div style="font-size:11px;color:'+T.sb+';margin-bottom:14px;animation:pulse 1.5s ease infinite">'+t("waitPl")+'</div>';

  if(isH){
    var minP=st.mode==="trust"?4:2;
    var canStart=ps.filter(function(p){return p.connected}).length>=minP;
    html+='<button class="btn" onclick="so.emit(\'start\')"'+(canStart?'':' disabled')+'>'+t("startGame")+'</button>';
  } else {
    html+='<div style="'+cds("padding:12px;text-align:center")+'"><div style="color:'+T.sb+';font-size:12px">'+t("waitHost")+'</div></div>';
  }
  html+='<br><button class="btn2" style="margin-top:12px" onclick="leaveOnline()">'+t("back")+'</button>';
  html+='</div>';
  $("app").innerHTML=html;
}

// ═══ RENDER: BUZZER (Normal mode) ═══
function renderBuzzer(){
  bst="ready";t0=0;
  var tgt=st.target;
  $("app").innerHTML='<div class="ct" style="animation:up .3s ease;padding-top:20px">'+
  '<div style="color:'+T.sb+';font-size:12px;margin-bottom:14px">'+t("rnd")+' '+st.round+'/'+st.totalRounds+'</div>'+
  (tgt!==null?'<div style="'+cds("display:inline-block;padding:12px 28px;border-left:3px solid "+A.v+";margin-bottom:16px")+'"><div style="font-size:9px;color:'+T.mt+'">'+t("tgtTime")+'</div><div style="font-size:44px;font-weight:900;font-family:monospace;color:'+T.tx+'">'+tgt.toFixed(1)+'s</div></div>':'<div style="font-size:14px;color:'+A.cy+';margin-bottom:16px">'+t("tgtHidden")+'</div>')+
  '<button id="bz" class="bz" style="background:linear-gradient(135deg,'+A.v+','+A.pk+');box-shadow:0 0 24px '+A.v+'30" onclick="doBuzz()"><span id="bzl">START</span></button></div>'
}

function doBuzz(){
  if(bst==="ready"){t0=Date.now();bst="timing";$("bz").style.background="linear-gradient(135deg,"+A.or+","+A.ro+")";$("bzl").textContent="STOP";vb(25)}
  else if(bst==="timing"){var el=Math.max(.01,(Date.now()-t0)/1000);bst="done";$("bz").style.background="linear-gradient(135deg,#5D5B7A,#555)";$("bzl").textContent="\u2713";sfxTap();vb([50,25,50]);so.emit("submit",{time:el});lastRenderedStatus="submitted";renderWaiting()}
}

// ═══ RENDER: ZEITGEFÜHL ═══
function renderZeitCountdown(){
  zeitCountdownActive=true;
  var c=3;
  $("app").innerHTML='<div class="ct" style="padding:50px 0"><div style="font-size:10px;color:'+T.mt+';letter-spacing:3px;text-transform:uppercase;margin-bottom:8px">'+t("getReady")+'</div><div id="cdn" style="font-size:96px;font-weight:900;background:linear-gradient(135deg,#6366F1,'+A.v+');-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:cPop .3s ease">3</div></div>';
  sfxTick();vb(10);
  var iv=setInterval(function(){
    c--;var el=$("cdn");if(!el){clearInterval(iv);return}
    if(c>0){el.textContent=c;el.style.animation="none";void el.offsetHeight;el.style.animation="cPop .3s ease";sfxTick();vb(10)}
    else if(c===0){el.textContent=t("now");el.style.background="linear-gradient(135deg,"+A.em+","+A.cy+")";el.style.WebkitBackgroundClip="text";sfxJetzt();vb([80,40,80,40,120]);t0=Date.now()}
    else{clearInterval(iv);renderZeitBreathing()}
  },1e3)
}

function renderZeitBreathing(){
  $("app").innerHTML='<div class="ct" style="padding:40px 0;animation:fadeIn .6s ease"><div style="position:relative;width:150px;height:150px;margin:0 auto 18px"><div style="position:absolute;inset:0;border-radius:50%;border:2px solid '+A.cy+'22;animation:ripple 2s ease infinite"></div><div style="width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,'+A.cy+'10,transparent 70%);display:flex;align-items:center;justify-content:center;animation:breathe 3s ease infinite"><div style="width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#6366F1,'+A.v+');opacity:.5"></div></div></div><div style="font-size:16px;font-weight:700;color:'+A.cy+'">'+t("countAlong")+'</div><div style="font-size:12px;color:'+T.mt+';margin-top:4px;font-style:italic">'+t("timerSince")+'</div></div>'
}

function renderZeitEstimate(){
  sfxGood();vb([50,25,50]);
  $("app").innerHTML='<div class="ct" style="padding:14px 0;animation:up .4s ease"><div style="font-size:60px;font-weight:900;background:linear-gradient(135deg,'+A.or+','+A.ro+');-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px;animation:pop .3s ease">'+t("stop")+'</div><div style="font-size:18px;font-weight:800;margin-bottom:16px">'+t("howLong")+'</div><div style="'+cds("display:inline-block;padding:18px 24px;border-top:3px solid "+A.cy+";max-width:240px")+'"><input id="zi" type="text" inputmode="decimal" placeholder="0.00" style="width:130px;text-align:center;font-size:42px;font-weight:900;color:'+T.tx+';font-family:monospace;border:none;border-bottom:3px solid '+T.ln+';background:transparent"><span style="font-size:18px;color:'+T.mt+'">s</span></div><br><button id="zb" class="btn" style="margin-top:16px" onclick="doZeitSubmit()">'+t("submit")+'</button></div>';
  setTimeout(function(){var i=$("zi");if(i)i.focus()},150)
}

function doZeitSubmit(){
  var g=parseFloat($("zi").value);if(isNaN(g)||g<=0)return;
  sfxTap();so.emit("submit",{time:g});
  lastRenderedStatus="submitted";renderWaiting()
}

// ═══ RENDER: WAITING ═══
function renderWaiting(){
  var subCount=st.submittedCount||0;
  var total=st.activeCount||0;
  $("app").innerHTML='<div class="ct" style="padding:60px 16px;animation:fadeIn .4s ease"><div style="display:flex;gap:6px;justify-content:center;margin-bottom:8px"><div style="width:8px;height:8px;border-radius:4px;background:'+A.v+';animation:dotP 1.2s ease 0s infinite"></div><div style="width:8px;height:8px;border-radius:4px;background:'+A.v+';animation:dotP 1.2s ease .2s infinite"></div><div style="width:8px;height:8px;border-radius:4px;background:'+A.v+';animation:dotP 1.2s ease .4s infinite"></div></div><div style="font-size:14px;color:'+T.sb+'">'+t("waiting")+'</div><div style="font-size:12px;color:'+T.mt+';margin-top:8px">'+subCount+'/'+total+'</div></div>'
}

// ═══ RENDER: RESULTS ═══
function renderResults(){
  var data=st.roundResults;if(!data)return;
  sfxGood();vb(25);
  var html='<div style="max-width:380px;margin:0 auto;animation:up .3s ease"><div class="ct" style="margin-bottom:14px"><div style="font-size:11px;color:'+T.mt+';letter-spacing:3px;text-transform:uppercase">'+t("elimRnd")+' '+data.round+'</div><div style="font-size:12px;color:'+T.sb+';margin-top:4px">'+t("tgt")+': '+data.target.toFixed(1)+'s</div></div>';

  data.results.forEach(function(r,i){
    var g=grade(r.ms);
    html+='<div style="'+cds("display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:7px;border-left:3px solid "+(r.elim?A.ro:g.c)+";background:"+(r.elim?A.ro+"15":T.cd)+";animation:sL .4s ease "+i*.08+"s both")+'">';
    html+='<span style="font-size:20px;width:30px;text-align:center">'+(r.elim?"\uD83D\uDC80":medal(r.rank))+'</span>';
    html+='<span style="flex:1"><b style="font-size:13px;color:'+(r.elim?A.ro:T.tx)+(r.elim?";text-decoration:line-through":"")+'">'+r.name+(r.id===myId?" (Du)":"")+'</b><br><span style="font-size:11px;color:'+T.sb+';font-family:monospace">'+r.time.toFixed(3)+'s</span></span>';
    html+='<span style="font-family:monospace;font-weight:800;font-size:14px;color:'+g.c+'">'+r.ms+'ms</span></div>'
  });

  var elim=data.results.filter(function(r){return r.elim})[0];
  if(elim)html+='<div class="ct" style="color:'+A.ro+';font-size:13px;font-weight:700;margin:8px 0;animation:shake .5s ease">\uD83D\uDC80 '+elim.name+' '+t("isOut")+'</div>';

  if(isH)html+='<div class="ct" style="margin-top:14px"><button class="btn" onclick="lastRenderedStatus=\'\';so.emit(\'nextRound\')">'+t("next")+'</button></div>';
  else html+='<div class="ct" style="margin-top:14px;color:'+T.sb+';font-size:12px;animation:pulse 1.5s ease infinite">'+t("discuss")+'</div>';

  html+='</div>';
  $("app").innerHTML=html;
}

// ═══ RENDER: WINNER ═══
function renderWinner(){
  confetti();sfxWin();vb([25,40,25,40,70]);
  var w=st.players.filter(function(p){return!p.elim})[0];
  $("app").innerHTML='<div class="ct" style="animation:pop .5s ease;padding-top:30px"><div style="font-size:60px;animation:float 2s ease infinite">\uD83C\uDFC6</div><div style="font-size:28px;font-weight:900;background:linear-gradient(135deg,'+A.am+',#FBBF24);-webkit-background-clip:text;-webkit-text-fill-color:transparent">'+(w?w.name:"?")+
  '</div><div style="font-size:12px;color:'+T.sb+';margin-top:4px">'+t("winsTrn")+
  '</div><button class="btn" style="margin-top:24px" onclick="leaveOnline()">'+t("home")+'</button></div>'
}

// ═══ RENDER: TRUST BREAKER SCREENS ═══
function renderFakePrompt(time){
  $("app").innerHTML='<div class="ct" style="padding:40px 16px;animation:pop .3s ease"><div style="font-size:22px;font-weight:800;color:'+A.or+';margin-bottom:8px">\uD83C\uDFAD '+t("fake")+
  '</div><div style="font-size:12px;color:'+T.mt+';margin-bottom:16px">'+time.toFixed(3)+'s</div><div style="display:flex;gap:10px;justify-content:center">'+
  '<button class="btn2" style="background:linear-gradient(135deg,#6366F1,'+A.v+')" onclick="so.emit(\'fakeAct\',{dir:\'minus\'});renderWaiting()">-0.4s</button>'+
  '<button class="btn2" onclick="so.emit(\'fakeSkip\');renderWaiting()">'+t("skip")+'</button>'+
  '<button class="btn2" style="background:linear-gradient(135deg,'+A.or+','+A.ro+')" onclick="so.emit(\'fakeAct\',{dir:\'plus\'});renderWaiting()">+0.4s</button></div></div>'
}

function renderSabPrompt(targets){
  var html='<div class="ct" style="padding:40px 16px;animation:pop .3s ease"><div style="font-size:22px;font-weight:800;color:'+A.ro+';margin-bottom:16px">\uD83D\uDDE1\uFE0F '+t("sabotage")+'</div>';
  targets.forEach(function(tg){
    html+='<button style="'+cds("width:100%;margin-bottom:8px;padding:14px 18px;cursor:pointer;text-align:left")+'" onclick="so.emit(\'sabAct\',{targetId:\''+tg.id+'\'});renderWaiting()"><b style="font-size:14px;color:'+T.tx+'">'+tg.name+'</b></button>'
  });
  html+='<button class="btn2" style="margin-top:6px" onclick="so.emit(\'sabSkip\');renderWaiting()">'+t("skip")+'</button></div>';
  $("app").innerHTML=html
}

function renderVoting(){
  window._vf=null;window._vs=null;
  var ps=st.players.filter(function(p){return p.id!==myId&&p.connected});
  var html='<div class="ct" style="padding:16px;animation:up .4s ease"><div class="gt" style="font-size:22px;font-weight:800;margin-bottom:14px">'+t("vote")+'</div>';
  html+='<div style="font-size:14px;font-weight:700;color:'+T.tx+';margin-bottom:8px">'+t("whoFake")+'</div><div id="vf" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px">';
  ps.forEach(function(p){html+='<button style="'+cds("padding:10px 16px;cursor:pointer")+'" onclick="pickV(\'f\',\''+p.id+'\',this)"><b style="font-size:13px;color:'+T.tx+'">'+p.name+'</b></button>'});
  html+='</div><div style="font-size:14px;font-weight:700;color:'+T.tx+';margin-bottom:8px">'+t("whoSab")+'</div><div id="vs" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px">';
  ps.forEach(function(p){html+='<button style="'+cds("padding:10px 16px;cursor:pointer")+'" onclick="pickV(\'s\',\''+p.id+'\',this)"><b style="font-size:13px;color:'+T.tx+'">'+p.name+'</b></button>'});
  html+='</div><button class="btn" onclick="doVote()">'+t("vote")+'</button></div>';
  $("app").innerHTML=html
}

function pickV(type,id,el){
  sfxTap();
  if(type==="f"){window._vf=id;$("vf").querySelectorAll("button").forEach(function(b){b.style.background=T.cd;b.style.borderColor=T.ln});el.style.background=A.or+"20";el.style.borderColor=A.or}
  else{window._vs=id;$("vs").querySelectorAll("button").forEach(function(b){b.style.background=T.cd;b.style.borderColor=T.ln});el.style.background=A.ro+"20";el.style.borderColor=A.ro}
}
function doVote(){if(!window._vf||!window._vs)return;so.emit("vote",{fakeGuess:window._vf,sabGuess:window._vs});renderWaiting()}

function renderTBReveal(data){
  confetti();sfxDrama();vb([25,40,25,40,70]);
  var html='<div class="ct" style="padding:20px 12px;animation:pop .5s ease"><div style="font-size:24px;font-weight:900;color:'+T.tx+';margin-bottom:14px">'+t("revealed")+'</div>';
  (st.players||[]).forEach(function(p,i){
    var role=(data.roles||{})[p.id]||"normal";
    var rc2=role==="fake"?A.or:role==="saboteur"?A.ro:A.em;
    var label=role==="fake"?"\uD83C\uDFAD "+t("fake"):role==="saboteur"?"\uD83D\uDDE1\uFE0F "+t("sab"):"\u2705 "+t("norm");
    html+='<div style="'+cds("padding:14px 16px;margin-bottom:8px;border-left:4px solid "+rc2+";text-align:left;animation:sL .4s ease "+i*.1+"s both")+'"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px;color:'+T.tx+'">'+p.name+(p.id===myId?" (Du)":"")+'</b><b style="font-size:12px;color:'+rc2+'">'+label+'</b></div></div>'
  });
  var wc=data.normalWin?A.em:A.ro;
  html+='<div style="'+cds("padding:16px;margin-top:12px;text-align:center;border-top:3px solid "+wc)+'"><div style="font-size:18px;font-weight:900;color:'+wc+';margin-bottom:4px">'+(data.normalWin?t("normWin"):t("cheatWin"))+'</div></div>';
  html+='<button class="btn" style="margin-top:16px" onclick="leaveOnline()">'+t("home")+'</button></div>';
  $("app").innerHTML=html
}

home();
</script></body></html>
