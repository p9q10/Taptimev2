<style>
:root{

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--text);min-height:100dvh;position:relative}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:250px;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(255,216,96,.1),transparent)}

button{font-family:var(--f);cursor:pointer;border:none;outline:none}

.btn{border-radius:14px;padding:16px 40px;color:#fff;font-size:15px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  background:linear-gradient(180deg,#FF7888,#FF5060);border:none;

.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #D43040}
.btn:disabled{opacity:.3;box-shadow:none;transform:none}
.btn-blue{background:linear-gradient(180deg,#6AB0F0,#4A90D9);box-shadow:0 6px 0 #3570B0,0 8px 20px rgba(74,144,217,.2),inset 0 2px 0 rgba(255,255,255,.2)}
.btn-blue:active{box-shadow:0 1px 0 #3570B0}
.btn-green{background:linear-gradient(180deg,#80E858,#5ABF38);box-shadow:0 6px 0 #3A8F20,0 8px 20px rgba(90,191,56,.2),inset 0 2px 0 rgba(255,255,255,.2)}
.btn-green:active{box-shadow:0 1px 0 #3A8F20}
.btn-red{background:linear-gradient(180deg,#FF7888,#FF5060);box-shadow:0 6px 0 #D43040,0 8px 20px rgba(255,80,96,.2),inset 0 2px 0 rgba(255,255,255,.2)}
.btn-red:active{box-shadow:0 1px 0 #D43040}

  box-shadow:0 3px 0 #D8C8B0}
.btn2:active{transform:translateY(2px);box-shadow:none}

.inp{font-size:16px;color:var(--text);background:var(--surf);
  border:3px solid var(--border);border-radius:14px;padding:14px 24px;text-align:center;
  width:100%;font-weight:700;font-family:var(--f);

.cd{border-radius:24px;background:var(--surf);border:3px solid var(--border);padding:20px;
  box-shadow:0 4px 0 #D8C8B0,0 8px 20px rgba(0,0,0,.05),inset 0 2px 0 rgba(255,255,255,.8)}
.ct{text-align:center}
.lb{font-size:9px;color:var(--sub);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-weight:800}

.dsp{font-family:var(--mono);color:var(--text);font-weight:500;font-feature-settings:"tnum"}

.bezel{position:relative;border-radius:50%;background:var(--surf);padding:4px;
  box-shadow:0 4px 0 #D8C8B0,0 8px 24px rgba(0,0,0,.06)}

.pchip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  border:2px solid var(--border);background:#FFF0D4;box-shadow:0 2px 0 #D8C8B0}

.time-display{background:linear-gradient(180deg,#1A1A2A,#0A0A18);border-radius:16px;border:3px solid #3A3A5A;
  padding:12px 18px;margin:10px auto;max-width:280px;box-shadow:inset 0 4px 12px rgba(0,0,0,.4),0 4px 0 rgba(0,0,0,.12);
  position:relative;overflow:hidden;text-align:center}
.time-display::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);pointer-events:none}

@keyframes redPulse{0%,100%{box-shadow:0 6px 0 #D43040,0 8px 20px rgba(255,80,96,.15)}50%{box-shadow:0 6px 0 #D43040,0 14px 30px rgba(255,80,96,.25)}}
@keyframes greenPulse{0%,100%{box-shadow:0 6px 0 #3A8F20,0 8px 20px rgba(90,191,56,.15)}50%{box-shadow:0 6px 0 #3A8F20,0 14px 30px rgba(90,191,56,.25)}}
@keyframes pinkPulse{0%,100%{box-shadow:0 6px 0 #C04070,0 8px 20px rgba(255,107,154,.15)}50%{box-shadow:0 6px 0 #C04070,0 14px 30px rgba(255,107,154,.25)}}
@keyframes ringExpand{0%{transform:scale(1);opacity:.3}100%{transform:scale(1.5);opacity:0}}
@keyframes tickFlash{0%,100%{opacity:.3}50%{opacity:1}}

@keyframes sweepHand{from{transform:translateX(-50%) rotate(0deg)}to{transform:translateX(-50%) rotate(360deg)}}
@keyframes lcdFlicker{0%,100%{opacity:1}50%{opacity:.95}}
@keyframes buzzerPress{0%{transform:scale(1)}50%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes resultPulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes screenShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes slideUp{0%{transform:translateY(10px);opacity:0}20%{transform:translateY(0);opacity:1}80%{transform:translateY(-10px);opacity:1}100%{transform:translateY(-30px);opacity:0}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes flashIn{0%{opacity:.3}100%{opacity:0}}

@keyframes podiumRise{0%{transform:translateY(60px);opacity:0}70%{transform:translateY(-4px)}100%{transform:translateY(0);opacity:1}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 8px rgba(255,184,0,.2))}50%{filter:drop-shadow(0 0 20px rgba(255,184,0,.5))}}
@keyframes nameReveal{0%{transform:scale(.3) translateY(20px);opacity:0;letter-spacing:12px}60%{transform:scale(1.08) translateY(-3px);opacity:1}100%{transform:scale(1) translateY(0);letter-spacing:3px}}
@keyframes rowSlide{0%{transform:translateX(-30px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes scoreCount{0%{transform:scale(1)}50%{transform:scale(1.3);color:var(--gold)}100%{transform:scale(1)}}

#flashOverlay{position:fixed;inset:0;pointer-events:none;z-index:9990;opacity:0}
#confettiBox{position:fixed;inset:0;pointer-events:none;z-index:9989;overflow:hidden}
.confetti{position:absolute;width:8px;height:8px;border-radius:2px;animation:confettiFall 2.5s ease-out forwards}
</style></head><body>

<!-- ══ SPLASH ══ -->
<div id="splash" style="position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:splashFade 2.6s ease forwards">
  <div style="width:100px;height:100px;margin-bottom:24px;border-radius:50%;background:linear-gradient(180deg,#FFD860,#FFB800);box-shadow:0 6px 0 #D49600,0 10px 28px rgba(255,184,0,.3),inset 0 3px 0 rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;animation:float 3s ease-in-out infinite">
    <div style="font-size:48px">⏱</div>
  </div>
  <div style="font-family:'Lilita One',cursive;font-size:36px;color:var(--text);letter-spacing:3px">TIME<span style="color:#FFB800;font-size:1.3em">2</span>TAP</div>
  <div style="font-size:10px;color:#A09080;margin-top:5px;letter-spacing:5px;font-weight:700">PARTY GAME</div>

    <div style="width:10px;height:10px;border-radius:50%;background:#FF5A6A;animation:breathe 1.2s ease infinite"></div>

  </div>

<script>
var actx=null;function initAudio(){if(!actx)try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}

/* ═══ ENHANCED SOUND ENGINE ═══ */
function sfx(f,d,t,v){initAudio();if(!actx)return;try{var o=actx.createOscillator(),g=actx.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=v||.2;g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}

/* Noise burst for physical "impact" feel */
function sfxNoise(d,v){initAudio();if(!actx)return;try{var sz=actx.sampleRate*d,buf=actx.createBuffer(1,sz,actx.sampleRate),data=buf.getChannelData(0);for(var i=0;i<sz;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/sz,3);var src=actx.createBufferSource(),g=actx.createGain(),flt=actx.createBiquadFilter();flt.type="lowpass";flt.frequency.value=800;src.buffer=buf;g.gain.value=v||.15;src.connect(flt);flt.connect(g);g.connect(actx.destination);src.start()}catch(e){}}

/* UI tap - clean, minimal */
function sfxTap(){sfx(900,.04,"sine",.12);sfx(1200,.03,"sine",.06)}

/* Round start - anticipation tick */
function sfxTick(){sfx(800,.05,"sine",.2);sfxNoise(.03,.05)}

/* Countdown reveal - ascending tension */
function sfxGo(){sfx(523,.12,"sine",.25);setTimeout(function(){sfx(659,.12,"sine",.25)},90);setTimeout(function(){sfx(784,.2,"sine",.3);sfxNoise(.06,.08)},180)}

/* Timer stop - decisive thud */
function sfxStop(){sfxNoise(.15,.2);sfx(220,.3,"triangle",.2);setTimeout(function(){sfx(165,.25,"triangle",.12)},80)}

/* BUZZER PRESS - the key emotional anchor: deep physical impact */
function sfxBuzzer(){initAudio();if(!actx)return;sfxNoise(.12,.25);sfx(110,.2,"triangle",.3);sfx(220,.08,"square",.1);setTimeout(function(){sfx(165,.15,"triangle",.1)},50)}

/* Perfect/good result - bright, satisfying, layered */
function sfxGood(){sfx(660,.1,"sine",.25);sfx(990,.08,"sine",.08);setTimeout(function(){sfx(880,.15,"sine",.25);sfx(1320,.1,"sine",.06)},90)}

/* Almost result - neutral, slight tension */
function sfxAlmost(){sfx(440,.2,"triangle",.15);setTimeout(function(){sfx(392,.25,"triangle",.12)},100)}

/* Bad result - low, dull impact */
function sfxBad(){sfxNoise(.2,.15);sfx(130,.4,"sawtooth",.15);setTimeout(function(){sfx(110,.3,"sawtooth",.08)},100)}

/* Elimination - dramatic descending */
function sfxElim(){sfx(440,.25,"square",.15);setTimeout(function(){sfx(349,.25,"square",.15)},180);setTimeout(function(){sfx(262,.4,"square",.2);sfxNoise(.15,.1)},360)}

/* Victory - triumphant ascending chord */
function sfxWin(){sfx(523,.12,"sine",.25);sfx(659,.12,"sine",.15);setTimeout(function(){sfx(659,.12,"sine",.25);sfx(784,.12,"sine",.15)},110);setTimeout(function(){sfx(784,.15,"sine",.25);sfx(988,.12,"sine",.15)},220);setTimeout(function(){sfx(1047,.3,"sine",.3);sfx(1318,.2,"sine",.1);sfxNoise(.08,.06)},340)}

/* ═══ TENSION SYSTEM - ambient pulse during gameplay ═══ */
var _tensionLoop=null,_tensionGain=null,_tensionOsc=null;
function startTension(){stopTension();initAudio();if(!actx)return;try{_tensionOsc=actx.createOscillator();_tensionGain=actx.createGain();var f=actx.createBiquadFilter();f.type="lowpass";f.frequency.value=300;_tensionOsc.type="sine";_tensionOsc.frequency.value=60;_tensionGain.gain.value=0;_tensionOsc.connect(f);f.connect(_tensionGain);_tensionGain.connect(actx.destination);_tensionOsc.start();var startT=Date.now();_tensionLoop=setInterval(function(){if(!_tensionGain)return;var elapsed=(Date.now()-startT)/1000;var intensity=Math.min(elapsed/10,.08);_tensionGain.gain.value=intensity*(0.7+0.3*Math.sin(elapsed*2))},200)}catch(e){}}
function stopTension(){if(_tensionLoop){clearInterval(_tensionLoop);_tensionLoop=null}if(_tensionOsc){try{_tensionOsc.stop()}catch(e){}_tensionOsc=null}_tensionGain=null}

/* ═══ BACKGROUND MUSIC - minimal adaptive loop ═══ */
var _musicNodes=[],_musicLoop=null,_musicPlaying=false;
function startMusic(){if(_musicPlaying)return;initAudio();if(!actx)return;_musicPlaying=true;playMusicBar()}
function playMusicBar(){if(!_musicPlaying||!actx)return;_musicNodes.forEach(function(n){try{n.disconnect()}catch(e){}});_musicNodes=[];try{var notes=[262,294,330,349,392,440];var t=actx.currentTime;for(var i=0;i<8;i++){var o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();f.type="lowpass";f.frequency.value=600;o.type="sine";o.frequency.value=notes[Math.floor(Math.random()*notes.length)]*(Math.random()>.5?1:0.5);g.gain.value=0;g.gain.setValueAtTime(0,t+i*0.5);g.gain.linearRampToValueAtTime(.03,t+i*0.5+0.05);g.gain.exponentialRampToValueAtTime(.001,t+i*0.5+0.45);o.connect(f);f.connect(g);g.connect(actx.destination);o.start(t+i*0.5);o.stop(t+i*0.5+0.5);_musicNodes.push(o)}_musicLoop=setTimeout(playMusicBar,4000)}catch(e){_musicPlaying=false}}
function stopMusic(){_musicPlaying=false;if(_musicLoop){clearTimeout(_musicLoop);_musicLoop=null}_musicNodes.forEach(function(n){try{n.stop()}catch(e){}});_musicNodes=[]}

/* ═══ SCREEN EFFECTS ═══ */
function screenFlash(color,duration){var el=$("flashOverlay");if(!el)return;el.style.background=color||"rgba(52,211,153,.3)";el.style.animation="none";void el.offsetWidth;el.style.animation="flashIn "+(duration||150)+"ms ease forwards"}

function screenShake(){var app=$("app");if(!app)return;app.style.animation="none";void app.offsetWidth;app.style.animation="screenShake .4s ease"}

function spawnConfetti(count){var box=$("confettiBox");if(!box)return;box.innerHTML="";var colors=["#FF5A6A","#4A90D9","#6ECF4A","#FFB800","#FF6B9A","#FF8A00"];for(var i=0;i<(count||20);i++){var d=document.createElement("div");d.className="confetti";d.style.left=Math.random()*100+"%";d.style.top="-10px";d.style.background=colors[Math.floor(Math.random()*colors.length)];d.style.animationDelay=Math.random()*0.8+"s";d.style.animationDuration=(2+Math.random()*1.5)+"s";d.style.width=(5+Math.random()*6)+"px";d.style.height=(5+Math.random()*6)+"px";d.style.borderRadius=Math.random()>.5?"50%":"2px";box.appendChild(d)}setTimeout(function(){box.innerHTML=""},4000)}

/* ═══ HAPTICS - tiered vibration patterns ═══ */
function vb(p){try{navigator.vibrate(p)}catch(e){}}
function vbLight(){vb(15)}
function vbMedium(){vb(40)}
function vbStrong(){vb([50,20,50])}
function vbBuzzer(){vb([60,15,30])}
function vbSuccess(){vb([30,40,30])}
function vbFail(){vb([80,20,40])}
function vbElim(){vb([60,30,60,30,120])}

/* ═══ VOICE ═══ */
function say(text,rate){try{if(!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.rate=rate||1.1;u.pitch=1.2;u.volume=0.8;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}catch(e){}}

/* ═══ COIN COUNT ANIMATION ═══ */
function coinCount(el,target,dur){if(!el)return;var t0=performance.now();dur=dur||800;
function tick(now){var p=Math.min(1,(now-t0)/dur);var eased=1-Math.pow(1-p,3);var v=Math.round(eased*target);el.textContent=v;
if(p<1){if(v%5===0)sfx(400+v*3,.02,"sine",.02);requestAnimationFrame(tick)}
else{el.textContent=target;el.style.animation="scoreCount .3s ease";sfx(800,.06,"sine",.1)}}
requestAnimationFrame(tick)}

/* ═══ GLOBAL BUTTON SOUNDS ═══ */
document.addEventListener("touchstart",function(e){if(e.target.tagName==="BUTTON"||e.target.closest("button")||e.target.onclick){initAudio();sfx(600,.03,"sine",.08);sfx(900,.02,"sine",.04);vb(8)}},{passive:true});
var so=io(location.origin,{reconnection:true,reconnectionAttempts:30});
var myId=null,room=null,myName="",myAvatar={sk:'k2',hr:'r1',hc:'c2',fc:'f1',gl:'g0',hd:'h0',jw:'j0'},selFormat="ffa";
var myCoins=350;

/* ═══════════════════════════════════════════
   FEATURE 1: ELO CLIENT STATE
   ═══════════════════════════════════════════ */
var ELO_GAME_MODES=["bullseye","timesense","memory","reaction","countdown","tapfrenzy"];
var ELO_MODE_NAMES={bullseye:"Bullseye",timesense:"Zeitgefühl",memory:"Memory",reaction:"Reaktion",countdown:"Countdown",tapfrenzy:"Tap Frenzy"};
function eloGetPid(){
  var p=null;
  try{p=localStorage.getItem('t2t_pid')}catch(e){}
  if(!p){
    p='p_'+Math.random().toString(36).substr(2,9)+'_'+Date.now().toString(36);
    try{localStorage.setItem('t2t_pid',p)}catch(e){}
  }
  /* Final guarantee: if somehow still null, use a runtime-only PID */
  if(!p)p='p_run_'+Math.random().toString(36).substr(2,12)+'_'+Date.now().toString(36);
  return p;
}
var myPid=eloGetPid();
/* Hard guarantee: never empty, never null */
if(!myPid||typeof myPid!=='string'||myPid.length<3){
  myPid='p_emergency_'+Math.random().toString(36).substr(2,9)+'_'+Date.now().toString(36);
}
function eloGetBackup(){
  try{var d=localStorage.getItem('t2t_elo');if(d)return JSON.parse(d)}catch(e){}
  return null;
}
function eloSaveBackup(eloData){
  if(!eloData)return;
  try{
    var clean={};
    ELO_GAME_MODES.forEach(function(m){
      if(eloData[m])clean[m]={elo:eloData[m].elo,matches:eloData[m].matches};
    });
    localStorage.setItem('t2t_elo',JSON.stringify(clean));
  }catch(e){}
}
function eloTier(elo){
  if(elo<800)return{name:"Bronze",icon:"🥉",color:"#A06030"};
  if(elo<1000)return{name:"Silber",icon:"🥈",color:"#8A8A8A"};
  if(elo<1200)return{name:"Gold",icon:"🥇",color:"#D4A040"};
  if(elo<1400)return{name:"Platin",icon:"💎",color:"#5BA3C0"};
  if(elo<1600)return{name:"Diamant",icon:"💠",color:"#7B68EE"};
  if(elo<1800)return{name:"Master",icon:"👑",color:"#C040A0"};
  return{name:"Grandmaster",icon:"⚡",color:"#FFB800"};
}
/* small ELO badge HTML for under-avatar in lobby/pregame */
function eloBadgeHTML(playerEloData,mode){
  if(!playerEloData)return'';
  var d=mode&&playerEloData[mode]?playerEloData[mode]:playerEloData.overall;

$("app").innerHTML='<div style="animation:up .3s ease">'+hdr+

function countdownTap(){
if(window._cd==="ready"){
  window._cd="running";window._cdStart=performance.now();
  sfxBuzzer();vbBuzzer();startTension();emitState({mode:"countdown",state:"running",target:room.roundData.targetTime,elapsedAtEmit:0});

    setTimeout(function(){if(b)b.style.animation="pinkPulse 1s ease infinite"},150)}
  window._cdFrame=requestAnimationFrame(countdownFrame);
}else if(window._cd==="running"){
  window._cd="done";cancelAnimationFrame(window._cdFrame);stopTension();
  var elapsed=performance.now()-window._cdStart;
  var progress=Math.min(elapsed/7000,1);

    b2.style.background=dev<.5?"rgba(52,211,153,.06)":"rgba(255,107,107,.06)";

    '<div style="font-size:16px;font-weight:900;color:'+rc+';letter-spacing:2px;animation:resultPulse .4s ease">'+rt+'</div>'+

  emitState({mode:"countdown",state:"done",dev:dev,rating:rt});

}}

function countdownFrame(){
  if(window._cd!=="running")return;
  var elapsed=performance.now()-window._cdStart;
  var progress=Math.min(elapsed/7000,1);
  var displayed=10*(1-Math.pow(progress,2.5));
  var disp=$("cdDisp");
  if(disp){
    var spd=progress<.3?"var(--text)":progress<.7?"#F472B6":"#F43F5E";
    disp.innerHTML='<span style="color:'+spd+'">'+displayed.toFixed(2)+'</span><span style="font-size:16px;color:var(--sub)">s</span>';
  }
  if(!window._lastSpecBroadcast||performance.now()-window._lastSpecBroadcast>250){window._lastSpecBroadcast=performance.now();emitState({mode:"countdown",state:"running",target:room.roundData.targetTime,periodic:true,displayValue:displayed.toFixed(2),progress:progress})}
