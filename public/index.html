<script>
var actx=null;function initAudio(){if(!actx)try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}

/* ═══ ENHANCED SOUND ENGINE ═══ */
function sfx(f,d,t,v){initAudio();if(!actx)return;try{var o=actx.createOscillator(),g=actx.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=v||.2;g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}

/* Noise burst for physical "impact" feel */
function sfxNoise(d,v){initAudio();if(!actx)return;try{var sz=actx.sampleRate*d,buf=actx.createBuffer(1,sz,actx.sampleRate),data=buf.getChannelData(0);for(var i=0;i<sz;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/sz,3);var src=actx.createBufferSource(),g=actx.createGain(),flt=actx.createBiquadFilter();flt.type="lowpass";flt.frequency.value=800;src.buffer=buf;g.gain.value=v||.15;src.connect(flt);flt.connect(g);g.connect(actx.destination);src.start()}catch(e){}}

/* UI tap - clean, minimal */
function sfxTap(){sfx(900,.04,"sine",.12);sfx(1200,.03,"sine",.06)}

/* Round start - anticipation tick */
function sfxTick(){sfx(800,.05,"sine",.2);sfxNoise(.03,.05)}

/* Countdown reveal - ascending tension */
function sfxGo(){sfx(523,.12,"sine",.25);setTimeout(function(){sfx(659,.12,"sine",.25)},90);setTimeout(function(){sfx(784,.2,"sine",.3);sfxNoise(.06,.08)},180)}

/* Timer stop - decisive thud */
function sfxStop(){sfxNoise(.15,.2);sfx(220,.3,"triangle",.2);setTimeout(function(){sfx(165,.25,"triangle",.12)},80)}

/* BUZZER PRESS - the key emotional anchor: deep physical impact */
function sfxBuzzer(){initAudio();if(!actx)return;sfxNoise(.12,.25);sfx(110,.2,"triangle",.3);sfx(220,.08,"square",.1);setTimeout(function(){sfx(165,.15,"triangle",.1)},50)}

/* Perfect/good result - bright, satisfying, layered */
function sfxGood(){sfx(660,.1,"sine",.25);sfx(990,.08,"sine",.08);setTimeout(function(){sfx(880,.15,"sine",.25);sfx(1320,.1,"sine",.06)},90)}

/* Almost result - neutral, slight tension */
function sfxAlmost(){sfx(440,.2,"triangle",.15);setTimeout(function(){sfx(392,.25,"triangle",.12)},100)}

/* Bad result - low, dull impact */
function sfxBad(){sfxNoise(.2,.15);sfx(130,.4,"sawtooth",.15);setTimeout(function(){sfx(110,.3,"sawtooth",.08)},100)}

/* Elimination - dramatic descending */
function sfxElim(){sfx(440,.25,"square",.15);setTimeout(function(){sfx(349,.25,"square",.15)},180);setTimeout(function(){sfx(262,.4,"square",.2);sfxNoise(.15,.1)},360)}

/* Victory - triumphant ascending chord */
function sfxWin(){sfx(523,.12,"sine",.25);sfx(659,.12,"sine",.15);setTimeout(function(){sfx(659,.12,"sine",.25);sfx(784,.12,"sine",.15)},110);setTimeout(function(){sfx(784,.15,"sine",.25);sfx(988,.12,"sine",.15)},220);setTimeout(function(){sfx(1047,.3,"sine",.3);sfx(1318,.2,"sine",.1);sfxNoise(.08,.06)},340)}

/* ═══ TENSION SYSTEM - ambient pulse during gameplay ═══ */
var _tensionLoop=null,_tensionGain=null,_tensionOsc=null;
function startTension(){stopTension();initAudio();if(!actx)return;try{_tensionOsc=actx.createOscillator();_tensionGain=actx.createGain();var f=actx.createBiquadFilter();f.type="lowpass";f.frequency.value=300;_tensionOsc.type="sine";_tensionOsc.frequency.value=60;_tensionGain.gain.value=0;_tensionOsc.connect(f);f.connect(_tensionGain);_tensionGain.connect(actx.destination);_tensionOsc.start();var startT=Date.now();_tensionLoop=setInterval(function(){if(!_tensionGain)return;var elapsed=(Date.now()-startT)/1000;var intensity=Math.min(elapsed/10,.08);_tensionGain.gain.value=intensity*(0.7+0.3*Math.sin(elapsed*2))},200)}catch(e){}}
function stopTension(){if(_tensionLoop){clearInterval(_tensionLoop);_tensionLoop=null}if(_tensionOsc){try{_tensionOsc.stop()}catch(e){}_tensionOsc=null}_tensionGain=null}

/* ═══ BACKGROUND MUSIC - minimal adaptive loop ═══ */
var _musicNodes=[],_musicLoop=null,_musicPlaying=false;
function startMusic(){if(_musicPlaying)return;initAudio();if(!actx)return;_musicPlaying=true;playMusicBar()}
function playMusicBar(){if(!_musicPlaying||!actx)return;_musicNodes.forEach(function(n){try{n.disconnect()}catch(e){}});_musicNodes=[];try{var notes=[262,294,330,349,392,440];var t=actx.currentTime;for(var i=0;i<8;i++){var o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();f.type="lowpass";f.frequency.value=600;o.type="sine";o.frequency.value=notes[Math.floor(Math.random()*notes.length)]*(Math.random()>.5?1:0.5);g.gain.value=0;g.gain.setValueAtTime(0,t+i*0.5);g.gain.linearRampToValueAtTime(.03,t+i*0.5+0.05);g.gain.exponentialRampToValueAtTime(.001,t+i*0.5+0.45);o.connect(f);f.connect(g);g.connect(actx.destination);o.start(t+i*0.5);o.stop(t+i*0.5+0.5);_musicNodes.push(o)}_musicLoop=setTimeout(playMusicBar,4000)}catch(e){_musicPlaying=false}}
function stopMusic(){_musicPlaying=false;if(_musicLoop){clearTimeout(_musicLoop);_musicLoop=null}_musicNodes.forEach(function(n){try{n.stop()}catch(e){}});_musicNodes=[]}

/* ═══ SCREEN EFFECTS ═══ */
function screenFlash(color,duration){var el=$("flashOverlay");if(!el)return;el.style.background=color||"rgba(52,211,153,.3)";el.style.animation="none";void el.offsetWidth;el.style.animation="flashIn "+(duration||150)+"ms ease forwards"}

function screenShake(){var app=$("app");if(!app)return;app.style.animation="none";void app.offsetWidth;app.style.animation="screenShake .4s ease"}

function spawnConfetti(count){var box=$("confettiBox");if(!box)return;box.innerHTML="";var colors=["#FF5A6A","#4A90D9","#6ECF4A","#FFB800","#FF6B9A","#FF8A00"];for(var i=0;i<(count||20);i++){var d=document.createElement("div");d.className="confetti";d.style.left=Math.random()*100+"%";d.style.top="-10px";d.style.background=colors[Math.floor(Math.random()*colors.length)];d.style.animationDelay=Math.random()*0.8+"s";d.style.animationDuration=(2+Math.random()*1.5)+"s";d.style.width=(5+Math.random()*6)+"px";d.style.height=(5+Math.random()*6)+"px";d.style.borderRadius=Math.random()>.5?"50%":"2px";box.appendChild(d)}setTimeout(function(){box.innerHTML=""},4000)}

/* ═══ HAPTICS - tiered vibration patterns ═══ */
function vb(p){try{navigator.vibrate(p)}catch(e){}}
function vbLight(){vb(15)}
function vbMedium(){vb(40)}
function vbStrong(){vb([50,20,50])}
function vbBuzzer(){vb([60,15,30])}
function vbSuccess(){vb([30,40,30])}
function vbFail(){vb([80,20,40])}
function vbElim(){vb([60,30,60,30,120])}

/* ═══ VOICE ═══ */
function say(text,rate){try{if(!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.rate=rate||1.1;u.pitch=1.2;u.volume=0.8;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}catch(e){}}

/* ═══ COIN COUNT ANIMATION ═══ */
function coinCount(el,target,dur){if(!el)return;var t0=performance.now();dur=dur||800;
function tick(now){var p=Math.min(1,(now-t0)/dur);var eased=1-Math.pow(1-p,3);var v=Math.round(eased*target);el.textContent=v;
if(p<1){if(v%5===0)sfx(400+v*3,.02,"sine",.02);requestAnimationFrame(tick)}
else{el.textContent=target;el.style.animation="scoreCount .3s ease";sfx(800,.06,"sine",.1)}}
requestAnimationFrame(tick)}

document.addEventListener("touchstart",function(e){if(e.target.tagName==="BUTTON"||e.target.closest("button")||e.target.onclick){initAudio();sfx(600,.03,"sine",.08);sfx(900,.02,"sine",.04);vb(8)}},{passive:true});

/* ══ PLAY ══ */
function rocketPlay(){
  _rk.running=true;_rk.level=1;_rk.lives=3;_rk.score=0;_rk.pts=15;
  _rk.combo=0;_rk.maxCombo=0;_rk.blocks=[];_rk.shots=[];_rk.idC=0;
  _rk.rocketStage=1;_rk.portalSpawned=false;_rk.rocketX=.5;
  _rk.elapsed=0;_rk.levelTimer=0;_rk.totalDestroyed=0;
  _rk.laserHitId=-1;_rk.laserTimer=0;
  _rk.lastTick=performance.now();rkLoadHigh();
  $('app').innerHTML=
  '<div style="position:relative;width:100%;height:calc(100dvh - 40px);overflow:hidden;touch-action:none;user-select:none">'+
  '<div id="rkBg" style="position:absolute;inset:0;transition:background 3s ease;background:'+rkSky().bg+'"></div>'+
  '<div id="rkEnv" style="position:absolute;inset:0;z-index:1;pointer-events:none"></div>'+
  /* HUD */
  '<div style="position:absolute;top:0;left:0;right:0;z-index:20;padding:48px 12px 0;pointer-events:none">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
      '<div><div id="rkPts" style="padding:5px 14px;border-radius:999px;background:rgba(0,0,0,.3);backdrop-filter:blur(6px);font-family:var(--mono);font-size:15px;font-weight:700;color:#FFD860">⚡ 15</div>'+
      '<div id="rkLvl" style="padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.15);font-size:9px;font-weight:800;color:rgba(255,255,255,.5);margin-top:4px;text-align:center">LVL 1</div></div>'+
      '<div style="text-align:center"><div id="rkScore" style="padding:3px 12px;border-radius:999px;background:rgba(0,0,0,.15);font-family:var(--mono);font-size:11px;font-weight:700;color:rgba(255,255,255,.5)">SCORE 0</div></div>'+
      '<div style="text-align:right"><div id="rkHeart" style="padding:4px 10px;border-radius:999px;background:rgba(255,60,60,.15);font-size:13px;letter-spacing:2px">❤️❤️❤️</div></div>'+
    '</div>'+
    '<div id="rkCombo" style="text-align:center;font-family:var(--ft);font-size:13px;color:#FFD860;opacity:0;margin-top:4px;transition:opacity .3s"></div>'+
  '</div>'+
  /* Game area */
  '<div id="rkArea" style="position:absolute;inset:0;z-index:5;overflow:hidden"></div>'+
  /* Laser SVG overlay */
  '<svg id="rkLaser" style="position:absolute;inset:0;z-index:8;pointer-events:none" width="100%" height="100%"></svg>'+
  /* Rocket */
  '<div id="rkShip" style="position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;transition:left .08s ease-out">'+rkRocketSVG(1,48)+'</div>'+
  /* Touch zone for steering */
  '<div id="rkTouch" style="position:absolute;bottom:0;left:0;right:0;height:100%;z-index:12"></div>'+
  /* Flash */
  '<div id="rkFlash" style="position:absolute;inset:0;z-index:25;pointer-events:none;opacity:0;transition:opacity .15s"></div>'+
  /* Level up */
  '<div id="rkLevelUp" style="position:absolute;top:28%;left:0;right:0;z-index:30;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s"></div>'+
  '</div>';
  _rk.area=$('rkArea');_rk.areaW=_rk.area.offsetWidth;_rk.areaH=_rk.area.offsetHeight;
  /* Steering: small thumb movement = big rocket movement */
  var touch=$('rkTouch');
  var _ts={on:false,sx:0,rx:0};
  touch.addEventListener('touchstart',function(e){e.preventDefault();_ts.on=true;_ts.sx=e.touches[0].clientX;_ts.rx=_rk.rocketX},{passive:false});
  touch.addEventListener('touchmove',function(e){e.preventDefault();if(!_ts.on)return;var dx=(e.touches[0].clientX-_ts.sx)/_rk.areaW*3.5;_rk.rocketX=Math.max(.05,Math.min(.95,_ts.rx+dx))},{passive:false});
  touch.addEventListener('touchend',function(){_ts.on=false});
  touch.addEventListener('mousedown',function(e){_ts.on=true;_ts.sx=e.clientX;_ts.rx=_rk.rocketX;
    function mm(ev){var dx=(ev.clientX-_ts.sx)/_rk.areaW*3.5;_rk.rocketX=Math.max(.05,Math.min(.95,_ts.rx+dx))}
    function mu(){_ts.on=false;document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu)}
    document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu)});
  rkBuildEnv();
  _rk.spawnT=setTimeout(rkSpawnLoop,700);
  _rk.frame=requestAnimationFrame(rkGameLoop);
  startMusic();
}

/* ══ ENVIRONMENT ══ */
function rkBuildEnv(){
  var el=$('rkEnv');if(!el)return;el.innerHTML='';var sky=rkSky();
  for(var i=0;i<sky.clouds*2;i++){var d=document.createElement('div');var w=80+Math.random()*120;
    d.style.cssText='position:absolute;top:'+Math.random()*80+'%;left:'+(Math.random()*80-10)+'%;width:'+w+'px;height:'+(w*.3)+'px;background:rgba(255,255,255,'+(0.06+Math.random()*.1)+');border-radius:999px';el.appendChild(d)}
  for(var j=0;j<sky.stars*3;j++){var star=document.createElement('div');var sz=1+Math.random()*2;
    star.style.cssText='position:absolute;top:'+Math.random()*85+'%;left:'+Math.random()*100+'%;width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:#fff;opacity:'+(0.1+Math.random()*0.3);el.appendChild(star)}
}

/* ══ SPAWN ══ */
function rkSpawnLoop(){
  if(!_rk.running)return;
  rkSpawnBlock('obs');
  if(Math.random()<.1)setTimeout(function(){if(_rk.running)rkSpawnBlock('bonus')},300);
  if(!_rk.portalSpawned&&_rk.levelTimer>10+Math.random()*5){_rk.portalSpawned=true;rkSpawnBlock('portal')}
  if(_rk.level>=3&&Math.random()<.06+_rk.level*.01)
    for(var i=0;i<1+Math.floor(_rk.level*.3);i++)setTimeout(function(){if(_rk.running)rkSpawnBlock('obs')},i*180);
  _rk.spawnT=setTimeout(rkSpawnLoop,rkSpawnRate());
}

function rkSpawnBlock(type){
  if(!_rk.area)return;
  var id=++_rk.idC;
  var bw=rkBlockW(),bh=Math.round(bw*.5);
  if(type==='portal'){bw=Math.max(90,bw+30);bh=Math.round(bw*.45)}
  if(type==='bonus'){bw=Math.max(54,bw-4);bh=Math.round(bw*.48)}
  var x=5+Math.random()*((_rk.areaW||300)-bw-10);
  var hp=type==='obs'?rkObsHP():type==='portal'?rkPortalHP():rkBonusHP();
  var reward=type==='obs'?rkReward(hp):type==='bonus'?Math.ceil(hp*3):0;
  var bg,brd,tc;
  if(type==='portal'){bg='linear-gradient(180deg,#208060,#106040)';brd='2.5px solid #40FFB0';tc='#80FFD0'}
  else if(type==='bonus'){bg='linear-gradient(180deg,#C89820,#A07810)';brd='2px solid #FFD860';tc='#FFE880'}
  else{bg='linear-gradient(180deg,#505868,#384050)';brd='2px solid #687080';tc='#C0C8D0'}
  var d=document.createElement('div');d.id='rkbl'+id;
  d.style.cssText='position:absolute;top:-'+bh+'px;left:'+x+'px;width:'+bw+'px;height:'+bh+'px;border-radius:10px;background:'+bg+';border:'+brd+';display:flex;align-items:center;justify-content:center;z-index:6;box-shadow:0 3px 10px rgba(0,0,0,.25);pointer-events:none';
  var icon=type==='portal'?'🌀 ':type==='bonus'?'⭐ ':'';
  d.innerHTML='<span style="font-family:var(--ft);font-size:'+(type==='portal'?'18':type==='bonus'?'15':'16')+'px;color:'+tc+';text-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none">'+icon+hp+'</span>';
  _rk.area.appendChild(d);
  var spd=rkSpeed();
  if(type==='portal')spd*=.5;else if(type==='bonus')spd*=.7;else spd*=(.8+Math.random()*.4);
  _rk.blocks.push({id:id,el:d,x:x,y:-bh,w:bw,h:bh,hp:hp,maxHp:hp,type:type,speed:spd,reward:reward});
}

/* ══ LASER HIT ══ */
function rkLaserHit(bl){
  if(_rk.pts<=0)return;
  _rk.pts--;bl.hp--;
  _rk.combo++;if(_rk.combo>_rk.maxCombo)_rk.maxCombo=_rk.combo;
  sfx(350+(bl.maxHp-bl.hp)*25,.03,'square',.05);
  if(bl.hp<=0){
    _rk.totalDestroyed++;
    if(bl.type==='portal'){rkLevelUp()}
    else{
      var pts=bl.reward;_rk.pts+=pts;_rk.score+=pts;
      if(bl.type==='bonus')sfxGood();
      var pop=document.createElement('div');
      pop.style.cssText='position:absolute;top:'+bl.y+'px;left:'+(bl.x+bl.w/2)+'px;transform:translateX(-50%);font-family:var(--ft);font-size:13px;color:'+(bl.type==='bonus'?'#FFD860':'#80FFA0')+';pointer-events:none;z-index:22;animation:slideUp .6s ease forwards;text-shadow:0 2px 6px rgba(0,0,0,.3)';
      pop.textContent='+'+pts+'⚡';
      if(_rk.area)_rk.area.appendChild(pop);
      setTimeout(function(){if(pop.parentNode)pop.parentNode.removeChild(pop)},700);
    }
    rkExplode(bl);
    if(bl.el&&bl.el.parentNode)bl.el.parentNode.removeChild(bl.el);
    var idx=_rk.blocks.indexOf(bl);if(idx>=0)_rk.blocks.splice(idx,1);
  }else{
    var icon=bl.type==='portal'?'🌀 ':bl.type==='bonus'?'⭐ ':'';
    var tc=bl.type==='portal'?'#80FFD0':bl.type==='bonus'?'#FFE880':'#C0C8D0';
    bl.el.innerHTML='<span style="font-family:var(--ft);font-size:'+(bl.type==='portal'?'18':bl.type==='bonus'?'15':'16')+'px;color:'+tc+';text-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none">'+icon+bl.hp+'</span>';
    bl.el.style.animation='none';void bl.el.offsetWidth;bl.el.style.animation='screenShake .1s ease';
    var pct=bl.hp/bl.maxHp;
    if(bl.type==='obs'&&pct<.3)bl.el.style.background='linear-gradient(180deg,#804040,#502828)';
    else if(bl.type==='obs'&&pct<.6)bl.el.style.background='linear-gradient(180deg,#605048,#483830)';
  }
  rkUpdateHUD();
}

/* ══ EXPLODE ══ */
function rkExplode(bl){
  if(!_rk.area)return;
  for(var i=0;i<8;i++){var p=document.createElement('div');var sz=3+Math.random()*5;
    var dx=(Math.random()-.5)*70,dy=(Math.random()-.5)*50-15;
    var col=bl.type==='portal'?'#40FFD0':bl.type==='bonus'?'#FFD860':'#8090A0';
    p.style.cssText='position:absolute;top:'+(bl.y+bl.h/2)+'px;left:'+(bl.x+bl.w/2)+'px;width:'+sz+'px;height:'+sz+'px;border-radius:2px;background:'+col+';pointer-events:none;z-index:21;transition:all .4s ease-out;opacity:1';
    _rk.area.appendChild(p);
    (function(el,ddx,ddy){requestAnimationFrame(function(){el.style.transform='translate('+ddx+'px,'+ddy+'px)';el.style.opacity='0'});
      setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},500)})(p,dx,dy)}
}

/* ══ HUD ══ */
function rkUpdateHUD(){
  var pe=$('rkPts');if(pe){pe.textContent='⚡ '+_rk.pts;pe.style.color=_rk.pts<5?'#FF6050':'#FFD860'}
  var le=$('rkLvl');if(le)le.textContent='LVL '+_rk.level;
  var sc=$('rkScore');if(sc)sc.textContent='SCORE '+_rk.score;
  var he=$('rkHeart');if(he){var h='';for(var i=0;i<3;i++)h+=i<_rk.lives?'❤️':'🖤';he.textContent=h}
}

/* ══ COLLISION ══ */
function rkHitRocket(bl){
  _rk.lives--;_rk.combo=0;sfxBad();vb([60,20,40]);
  var fl=$('rkFlash');if(fl){fl.style.background='rgba(255,60,40,.25)';fl.style.opacity='1';setTimeout(function(){if(fl)fl.style.opacity='0'},250)}
  if(bl.el&&bl.el.parentNode)bl.el.parentNode.removeChild(bl.el);
  var idx=_rk.blocks.indexOf(bl);if(idx>=0)_rk.blocks.splice(idx,1);
  rkUpdateHUD();
  if(_rk.lives<=0)rocketGameOver('crash');
}

/* ══ LEVEL UP ══ */
function rkLevelUp(){
  _rk.level++;_rk.rocketStage=Math.min(8,_rk.level);_rk.levelTimer=0;_rk.portalSpawned=false;
  _rk.pts+=10;/* bonus energy for next level */
  _rk.score+=50;
  var names=['','🔧 Repariert!','⚡ Triebwerk!','🔥 Feuer!','💎 Blau!','⚡ High-Tech!','🌟 Plasma!','👑 Legendär!'];
  var msg=names[Math.min(_rk.level-1,7)]||'';
  var lu=$('rkLevelUp');if(lu){
    lu.innerHTML='<div style="font-family:var(--ft);font-size:32px;color:#80FFD0;text-shadow:0 0 20px rgba(80,255,200,.3);letter-spacing:3px;animation:pop .4s ease">LEVEL '+_rk.level+'!</div>'+(msg?'<div style="font-family:var(--ft);font-size:14px;color:#FFD860;margin-top:6px;animation:pop .4s .2s ease both">'+msg+'</div>':'')+
    '<div style="font-size:11px;color:rgba(255,255,255,.4);margin-top:8px;font-weight:700;animation:pop .4s .4s ease both">+10⚡ Bonus!</div>';
    lu.style.opacity='1';setTimeout(function(){if(lu)lu.style.opacity='0'},2200)}
  sfxWin();vb([30,20,30,20,50]);
  var fl=$('rkFlash');if(fl){fl.style.background='rgba(80,255,200,.12)';fl.style.opacity='1';setTimeout(function(){if(fl)fl.style.opacity='0'},300)}
  var ship=$('rkShip');if(ship)ship.innerHTML=rkRocketSVG(_rk.rocketStage,48);
  var bg=$('rkBg');if(bg)bg.style.background=rkSky().bg;
  rkBuildEnv();rkUpdateHUD();
}

/* ══ GAME LOOP ══ */
function rkGameLoop(now){
  if(!_rk.running)return;
  var dt=(now-_rk.lastTick)/1000;_rk.lastTick=now;if(dt>0.1)dt=0.1;
  _rk.elapsed+=dt;_rk.levelTimer+=dt;
  /* Position rocket */
  var ship=$('rkShip');
  var shipPX=_rk.rocketX*_rk.areaW;
  if(ship)ship.style.left=shipPX+'px';
  var shipY=_rk.areaH-55,shipW=48,shipH=75;
  /* ══ LASER ══ */
  /* ══ LASER SHOTS ══ */
  _rk.laserTimer-=dt;
  var laserSVG=$('rkLaser');
  /* Spawn new shot */
  if(_rk.laserTimer<=0&&_rk.pts>0){
    _rk.laserTimer=_rk.laserRate;
    _rk.shots.push({x:shipPX,y:shipY-10,speed:800});
    sfx(500+Math.random()*100,.015,'square',.03);
  }
  /* Move shots & check collision */
  var svgH='';
  for(var si=_rk.shots.length-1;si>=0;si--){
    var sh=_rk.shots[si];sh.y-=sh.speed*dt;
    if(sh.y<-10){_rk.shots.splice(si,1);continue}
    /* Draw shot */
    svgH+='<rect x="'+(sh.x-2)+'" y="'+sh.y+'" width="4" height="10" rx="2" fill="#FFD860" opacity=".8"/>';
    svgH+='<rect x="'+(sh.x-1)+'" y="'+(sh.y+2)+'" width="2" height="6" rx="1" fill="#FFF8E0"/>';
    /* Check hit against blocks */
    var hit=false;
    for(var bi=0;bi<_rk.blocks.length;bi++){
      var bk=_rk.blocks[bi];
      if(sh.x>=bk.x&&sh.x<=bk.x+bk.w&&sh.y<=bk.y+bk.h&&sh.y>=bk.y){
        _rk.shots.splice(si,1);hit=true;
        rkLaserHit(bk);if(!_rk.running)return;break;
      }
    }
    if(hit)continue;
  }
  if(laserSVG)laserSVG.innerHTML=svgH;
  /* ══ MOVE BLOCKS ══ */
  for(var i=_rk.blocks.length-1;i>=0;i--){
    var bl=_rk.blocks[i];bl.y+=bl.speed*dt;
    if(bl.el)bl.el.style.top=bl.y+'px';
    /* Hit rocket */
    if(bl.y+bl.h>shipY&&bl.y<shipY+shipH&&bl.x+bl.w>shipPX-shipW/2&&bl.x<shipPX+shipW/2){
      rkHitRocket(bl);if(!_rk.running)return;continue;
    }
    /* Off screen */
    if(bl.y>_rk.areaH+10){
      if(bl.type==='portal'){rocketGameOver('portal');return}
      _rk.combo=0;
      if(bl.el&&bl.el.parentNode)bl.el.parentNode.removeChild(bl.el);
      _rk.blocks.splice(i,1);
    }
  }
  /* Combo display */
  var ce=$('rkCombo');if(ce){ce.textContent='×'+_rk.combo;ce.style.opacity=_rk.combo>=5?'1':'0'}
  /* Score ticks */
  _rk.score+=Math.floor(dt);var sc=$('rkScore');if(sc)sc.textContent='SCORE '+_rk.score;
  _rk.frame=requestAnimationFrame(rkGameLoop);
}

/* ══ GAME OVER ══ */
function rocketGameOver(reason){
  _rk.running=false;cancelAnimationFrame(_rk.frame);clearTimeout(_rk.spawnT);stopMusic();
  var sc=_rk.score;
  var isNew=sc>_rk.highscore;if(isNew)_rk.highscore=sc;
  if(_rk.level>_rk.bestLevel)_rk.bestLevel=_rk.level;rkSaveHigh();
  if(isNew){sfxWin();setTimeout(function(){spawnConfetti(30)},300)}else{sfxBad();vb([60,30,60])}
  var emoji=reason==='portal'?'🚫':'💥';
  var title=reason==='portal'?'PORTAL VERPASST':'MISSION GESCHEITERT';
  var sub=reason==='portal'?'Portal nicht rechtzeitig zerstört!':'3 Treffer — Rakete zerstört';
  setTimeout(function(){
  $('app').innerHTML='<div class="ct" style="animation:pop .5s ease;padding-top:18px">'+
    '<div style="font-size:48px;margin-bottom:6px">'+emoji+'</div>'+
    '<div style="font-family:var(--ft);font-size:20px;color:var(--red);letter-spacing:2px">'+title+'</div>'+
    '<div style="font-size:10px;color:var(--sub);font-weight:700;margin-top:4px">'+sub+'</div>'+
    '<div class="cd" style="margin:14px 0;padding:16px"><div class="ct">'+
      (isNew?'<div style="font-size:10px;color:var(--green);font-weight:800;letter-spacing:2px;margin-bottom:6px;animation:breathe 2s ease infinite">⭐ NEUER HIGHSCORE ⭐</div>':'')+
      '<div style="font-family:var(--mono);font-size:38px;color:var(--text);font-weight:500;line-height:1">'+sc+'</div>'+
      '<div style="font-size:10px;color:var(--sub);font-weight:700;margin-top:4px">PUNKTE</div>'+
      '<div style="display:flex;justify-content:center;gap:14px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">'+
        '<div><div style="font-size:7px;color:var(--sub);font-weight:800">LEVEL</div><div style="font-family:var(--ft);font-size:18px;color:var(--gold);margin-top:2px">'+_rk.level+'</div></div>'+
        '<div><div style="font-size:7px;color:var(--sub);font-weight:800">RAKETE</div><div style="margin-top:4px">'+rkRocketSVG(_rk.rocketStage,26)+'</div></div>'+
        '<div><div style="font-size:7px;color:var(--sub);font-weight:800">COMBO</div><div style="font-family:var(--mono);font-size:18px;color:var(--text);margin-top:2px">×'+_rk.maxCombo+'</div></div>'+
        '<div><div style="font-size:7px;color:var(--sub);font-weight:800">ZERSTÖRT</div><div style="font-family:var(--mono);font-size:18px;color:var(--green);margin-top:2px">'+_rk.totalDestroyed+'</div></div>'+
      '</div>'+
      (!isNew?'<div style="font-size:9px;color:var(--sub);font-weight:700;margin-top:8px">Bester: '+_rk.highscore+'</div>':'')+
    '</div></div>'+
    '<button class="btn" onclick="rocketPlay()" style="margin-bottom:8px">🔄 NOCHMAL</button>'+
    '<button class="btn2" onclick="home()">← Hauptmenü</button></div>';
  },isNew?200:500);
}

</script></body></html>
