<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>TimeTap</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'SF Pro Display','Segoe UI',system-ui,sans-serif;background:#F5F5F0;color:#1a1a1a;min-height:100dvh}
#app{max-width:440px;margin:0 auto;padding:14px 16px 40px}
button{font-family:inherit;cursor:pointer;border:none;outline:none}input{font-family:inherit;outline:none}
.btn{border-radius:14px;padding:16px 36px;color:#fff;font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:#1a1a1a;border:none;transition:transform .12s,opacity .12s;width:100%;max-width:320px}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.3}
.btn-warm{background:#E07A4A}.btn-blue{background:#4A90D9}.btn-green{background:#4AAD7A}.btn-soft{background:#E8E4DE;color:#1a1a1a}
.btn2{border-radius:10px;padding:10px 18px;color:#666;font-size:13px;font-weight:600;background:#E8E4DE}
.inp{font-size:16px;color:#1a1a1a;background:#fff;border:2px solid #D4D0C8;border-radius:14px;padding:14px 18px;text-align:center;width:100%;font-weight:700}.inp:focus{border-color:#4A90D9}
.cd{border-radius:16px;background:#fff;border:1px solid #E8E4DE;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.ct{text-align:center}
.lb{font-size:10px;color:#999;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes slideIn{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes splashFade{0%{opacity:1}80%{opacity:1}100%{opacity:0;pointer-events:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style></head><body>
<div id="splash" style="position:fixed;inset:0;background:#F5F5F0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:splashFade 2.5s ease forwards">
<div style="font-size:44px;font-weight:900;color:#1a1a1a">TimeTap</div>
<div style="font-size:12px;color:#999;margin-top:8px;letter-spacing:4px">PARTY GAME</div>
<div style="margin-top:24px;width:36px;height:36px;border:3px solid #D4D0C8;border-top-color:#1a1a1a;border-radius:50%;animation:spin 1s linear infinite"></div>
</div><div id="app"></div>
<script>
var actx=null;function initAudio(){if(!actx)try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function sfx(f,d,t,v){initAudio();if(!actx)return;try{var o=actx.createOscillator(),g=actx.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=v||.2;g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function sfxTick(){sfx(600,.06,"sine",.3)}
function sfxGo(){sfx(440,.15,"sine",.3);setTimeout(function(){sfx(554,.15,"sine",.3)},100);setTimeout(function(){sfx(660,.25,"sine",.35)},200)}
function sfxStop(){sfx(330,.4,"square",.25);setTimeout(function(){sfx(220,.4,"square",.2)},120)}
function sfxGood(){sfx(660,.12,"sine",.3);setTimeout(function(){sfx(880,.18,"sine",.3)},100)}
function sfxBad(){sfx(180,.4,"sawtooth",.2)}
function sfxElim(){sfx(440,.3,"square",.2);setTimeout(function(){sfx(330,.3,"square",.2)},200);setTimeout(function(){sfx(220,.5,"square",.25)},400)}
function sfxWin(){sfx(523,.15,"sine",.3);setTimeout(function(){sfx(659,.15)},120);setTimeout(function(){sfx(784,.15)},240);setTimeout(function(){sfx(1047,.3)},360)}
function vb(p){try{navigator.vibrate(p)}catch(e){}}

var so=io(location.origin,{reconnection:true,reconnectionAttempts:30});
var myId=null,room=null,myName="",myAvatar="😎",selMode="",selFormat="ffa";
var AV=["😎","🔥","⚡","🎯","💀","👾","🤖","🎮","🦊","🐸","🌟","💎","🎪","🎭","🃏","🧨"];
var MODES=[{id:"bullseye",name:"Bullseye",desc:"Triff die Zielzeit",icon:"🎯",color:"#E07A4A"},
{id:"timesense",name:"Zeitgefühl",desc:"Schätze die versteckte Zeit",icon:"🧠",color:"#4A90D9"},
{id:"memory",name:"Memory",desc:"Merk dir die Zahl",icon:"💾",color:"#4AAD7A"},
{id:"reaction",name:"Reaktion",desc:"Finde den grünen Buzzer",icon:"⚡",color:"#D4A04A"}];
var DESCS={bullseye:"START drücken, Zielzeit im Kopf zählen, STOPP drücken.",bullseyeTeam:"Gemeinsam die Zielzeit erreichen. Jeder zählt seinen Teil, Kapitän bestätigt.",timesense:"Buzzer wird grün = zählen! Die App stoppt. Du gibst deine Schätzung ein.",memory:"Zahl erscheint kurz. Merken! Dann eingeben.",reaction:"10 Buzzer. Einer wird grün. Sofort drücken!"};
function $(id){return document.getElementById(id)}
function fullClientReset(){clearTimeout(window._tsWait);clearTimeout(window._rt);window._bs=null;window._rs=null;window._tbs=null;submitted=false;lastRound=0;lastPhase="";lastTeamSubCount=0;lastReadyCount=0}
setTimeout(function(){var s=$("splash");if(s)s.style.display="none";home()},2500);
so.on("connect",function(){myId=so.id});
var lastPhase="",lastRound=0,submitted=false,lastTeamSubCount=0,lastReadyCount=0;

so.on("sync",function(data){room=data;
  if(room.phase==="playing"&&room.currentRound!==lastRound){submitted=false;lastRound=room.currentRound;lastTeamSubCount=0;lastReadyCount=0}
  if(room.phase==="playing"&&submitted){renderWaiting();lastPhase=room.phase;return}
  var tsC=room.teamSubs?Object.keys(room.teamSubs).length:0;var tCh=room.roundData&&room.roundData.teamMode&&tsC!==lastTeamSubCount;if(tCh)lastTeamSubCount=tsC;
  var rdC=room.readyPlayers?Object.keys(room.readyPlayers).length:0;var rdCh=room.mode==="memory"&&rdC!==lastReadyCount;if(rdCh)lastReadyCount=rdC;
  if(room.phase==="playing"&&lastPhase==="playing"&&!submitted&&!tCh&&!rdCh)return;
  if(room.phase===lastPhase&&(room.phase==="results"||room.phase==="gameover"||room.phase==="pregame"||room.phase==="elimination"))return;
  lastPhase=room.phase;render()});
so.on("zeitStop",function(d){if(submitted||!room||room.phase!=="playing"||room.mode!=="timesense")return;window._zeitActual=d.actual;sfxStop();vb([80,30,80]);renderZeitInput()});
so.on("memoryShow",function(){if(submitted||!room||room.phase!=="playing"||room.mode!=="memory")return;showMemoryNumber()});

function render(){if(!room)return;switch(room.phase){case"lobby":renderLobby();break;case"pregame":renderPreGame();break;case"playing":renderPlaying();break;case"results":renderResults();break;case"elimination":renderElimination();break;case"gameover":renderGameOver();break}}

// ═══ HOME ═══
function home(){so.emit("leave");room=null;fullClientReset();
  $("app").innerHTML='<div class="ct" style="animation:up .5s ease;padding-top:30px"><div style="font-size:38px;font-weight:900;color:#1a1a1a;margin-bottom:4px">TimeTap</div><div style="font-size:13px;color:#999;margin-bottom:32px">Wähle ein Spiel</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+
  MODES.map(function(m){return'<button onclick="initAudio();pickGame(\''+m.id+'\')" style="background:#fff;border:2px solid #E8E4DE;border-radius:18px;padding:24px 12px;color:#1a1a1a;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:transform .12s"><div style="font-size:34px;margin-bottom:8px">'+m.icon+'</div><div style="font-size:14px;font-weight:800">'+m.name+'</div><div style="font-size:10px;color:#999;margin-top:4px;line-height:1.3">'+m.desc+'</div></button>'}).join('')+'</div></div>'}

function pickGame(mode){selMode=mode;var m=MODES.find(function(x){return x.id===mode});
  $("app").innerHTML='<div style="animation:up .4s ease"><button class="btn2" onclick="home()">← Zurück</button><div class="ct" style="margin:20px 0"><div style="font-size:34px">'+m.icon+'</div><div style="font-size:22px;font-weight:900;margin-top:8px">'+m.name+'</div></div><div class="lb" style="margin-top:20px">Format</div><button onclick="selFormat=\'ffa\';setupRoom()" style="width:100%;padding:18px 20px;margin-bottom:12px;display:flex;align-items:center;gap:16px;text-align:left;border-radius:16px;border:2px solid #E8E4DE;color:#1a1a1a;background:#fff"><span style="font-size:28px">⚔️</span><div><div style="font-size:16px;font-weight:800">Alle gegen Alle</div><div style="font-size:11px;color:#999">Elimination bis zum Sieger</div></div></button><button onclick="selFormat=\'teams\';setupRoom()" style="width:100%;padding:18px 20px;margin-bottom:12px;display:flex;align-items:center;gap:16px;text-align:left;border-radius:16px;border:2px solid #E8E4DE;color:#1a1a1a;background:#fff"><span style="font-size:28px">🤝</span><div><div style="font-size:16px;font-weight:800">Team vs Team</div><div style="font-size:11px;color:#999">Gemeinsam gewinnen</div></div></button></div>'}

function setupRoom(){$("app").innerHTML='<div style="animation:up .4s ease"><button class="btn2" onclick="pickGame(\''+selMode+'\')">← Zurück</button><div class="ct" style="margin:16px 0"><div style="font-size:18px;font-weight:900">Spieler-Info</div></div><div class="cd" style="margin-bottom:16px"><div class="lb">Name</div><input id="nm" class="inp" placeholder="Name" maxlength="12" value="'+myName+'"><div class="lb" style="margin-top:16px">Avatar</div><div id="avs" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px"></div></div><div id="err" style="font-size:12px;color:#D94A4A;margin-bottom:12px;text-align:center"></div><div style="display:flex;gap:14px;justify-content:center"><div class="ct"><button onclick="doCreate()" style="width:76px;height:76px;border-radius:50%;background:#1a1a1a;font-size:26px;color:#fff;display:flex;align-items:center;justify-content:center;border:none">+</button><div style="font-size:11px;color:#999;margin-top:6px">Erstellen</div></div><div class="ct"><button onclick="joinScreen()" style="width:76px;height:76px;border-radius:50%;background:#4A90D9;font-size:26px;color:#fff;display:flex;align-items:center;justify-content:center;border:none">→</button><div style="font-size:11px;color:#999;margin-top:6px">Beitreten</div></div></div></div>';renderAvatars()}
function renderAvatars(){var g=$("avs");if(!g)return;g.innerHTML=AV.map(function(a){return'<div onclick="myAvatar=\''+a+'\';renderAvatars()" style="width:42px;height:42px;font-size:22px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:'+(myAvatar===a?"2px solid #1a1a1a":"1px solid #D4D0C8")+';background:'+(myAvatar===a?"#E8E4DE":"#fff")+';cursor:pointer">'+a+'</div>'}).join("")}
function doCreate(){var n=$("nm");if(!n||!n.value.trim()){$("err").textContent="Name eingeben!";return}myName=n.value.trim();fullClientReset();so.emit("create",{name:myName,avatar:myAvatar,mode:selMode,format:selFormat,roundsPerPhase:3},function(r){if(!r.ok)$("err").textContent=r.err})}
function joinScreen(){var n=$("nm");if(!n||!n.value.trim()){$("err").textContent="Name eingeben!";return}myName=n.value.trim();$("app").innerHTML='<div class="ct" style="animation:up .4s ease;padding-top:30px"><div style="font-size:34px;margin-bottom:12px">🔑</div><div style="font-size:18px;font-weight:800;margin-bottom:16px">Raum beitreten</div><input id="ji" class="inp" placeholder="CODE" maxlength="4" style="letter-spacing:8px;font-size:24px;font-weight:900;font-family:monospace;margin-bottom:12px;max-width:240px" oninput="this.value=this.value.toUpperCase()"><div id="jerr" style="font-size:12px;color:#D94A4A;margin-bottom:12px"></div><button class="btn btn-blue" onclick="doJoin()">Beitreten</button><br><button class="btn2" style="margin-top:16px" onclick="setupRoom()">← Zurück</button></div>'}
function doJoin(){var c=$("ji");if(!c||c.value.length<4){$("jerr").textContent="4-stelliger Code!";return}fullClientReset();so.emit("join",{code:c.value,name:myName,avatar:myAvatar},function(r){if(!r.ok)$("jerr").textContent=r.err})}

// ═══ LOBBY ═══
function renderLobby(){var isHost=room.hostId===room.myId,ps=room.players||[],m=MODES.find(function(x){return x.id===room.mode})||MODES[0];
  var html='<div style="animation:up .4s ease"><div class="ct" style="margin-bottom:20px"><button onclick="try{navigator.clipboard.writeText(\''+room.code+'\')}catch(e){}" style="display:inline-block;padding:14px 28px;border-radius:16px;background:#fff;border:2px solid #E8E4DE;cursor:pointer"><div class="lb">Code</div><div style="font-size:30px;font-weight:900;font-family:monospace;letter-spacing:8px;color:#1a1a1a">'+room.code+'</div></button></div>';
  html+='<div class="cd" style="margin-bottom:14px"><div class="lb">'+m.icon+' '+m.name+' · '+(room.format==="ffa"?"Alle vs Alle":"Teams")+'</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">';
  ps.forEach(function(p){html+='<div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;border:1px solid #D4D0C8;background:#F5F5F0;opacity:'+(p.connected?'1':'.4')+'"><span style="font-size:20px">'+p.avatar+'</span><span style="font-size:13px;font-weight:700">'+p.name+(p.id===room.myId?' <span style="font-size:9px;color:#4A90D9;background:#4A90D920;padding:2px 6px;border-radius:4px">DU</span>':'')+'</span></div>'});
  html+='</div></div>';
  if(room.format==="teams"){var myP=ps.find(function(p){return p.id===room.myId});var mt=myP?myP.team:null;
    html+='<div class="cd" style="margin-bottom:14px"><div class="lb">Dein Team</div><div style="display:flex;gap:10px;margin-top:8px"><button onclick="so.emit(\'setTeam\',{team:\'a\'})" style="flex:1;padding:14px;border-radius:12px;border:'+(mt==="a"?"2px solid #E07A4A":"1px solid #D4D0C8")+';background:'+(mt==="a"?"#E07A4A15":"#fff")+';color:'+(mt==="a"?"#E07A4A":"#999")+';font-size:14px;font-weight:800">Team A 🟠</button><button onclick="so.emit(\'setTeam\',{team:\'b\'})" style="flex:1;padding:14px;border-radius:12px;border:'+(mt==="b"?"2px solid #4A90D9":"1px solid #D4D0C8")+';background:'+(mt==="b"?"#4A90D915":"#fff")+';color:'+(mt==="b"?"#4A90D9":"#999")+';font-size:14px;font-weight:800">Team B 🔵</button></div></div>'}
  if(isHost){html+='<div class="cd" style="margin-bottom:14px"><div class="lb">Runden pro Phase</div><div style="display:flex;gap:8px;margin-top:8px">';[2,3,5].forEach(function(r){var sel=room.roundsPerPhase===r;html+='<div onclick="so.emit(\'updateSettings\',{roundsPerPhase:'+r+'})" style="flex:1;padding:12px;cursor:pointer;text-align:center;border-radius:12px;border:'+(sel?"2px solid #1a1a1a":"1px solid #D4D0C8")+';background:'+(sel?"#1a1a1a":"#fff")+';font-size:18px;font-weight:900;color:'+(sel?"#fff":"#999")+'">'+r+'</div>'});
    html+='</div></div><div class="ct"><button class="btn" onclick="so.emit(\'start\')"'+(ps.filter(function(p){return p.connected}).length>=2?'':' disabled')+'>Spiel starten</button></div>';
  } else html+='<div class="ct" style="margin-top:20px"><div style="font-size:13px;color:#999">Warte auf den Host...</div></div>';
  html+='<div class="ct" style="margin-top:20px"><button class="btn2" onclick="home()">← Verlassen</button></div></div>';$("app").innerHTML=html}

// ═══ PRE-GAME ═══
function renderPreGame(){var m=MODES.find(function(x){return x.id===room.mode})||MODES[0];var ps=room.players.filter(function(p){return p.connected});var isHost=room.hostId===room.myId;
  var dk=room.mode==="bullseye"&&room.format==="teams"?"bullseyeTeam":room.mode;
  $("app").innerHTML='<div class="ct" style="animation:pop .4s ease;padding-top:16px"><div style="font-size:38px;margin-bottom:12px">'+m.icon+'</div><div style="font-size:24px;font-weight:900;margin-bottom:4px">'+m.name+'</div><div style="font-size:12px;color:#999;margin-bottom:20px">'+(room.format==="ffa"?"Alle gegen Alle — Elimination":"Team vs Team")+'</div><div class="cd" style="margin-bottom:20px;text-align:left"><div style="font-size:13px;color:#666;line-height:1.6">'+(DESCS[dk]||DESCS[room.mode])+'</div></div><div class="cd" style="margin-bottom:20px"><div class="lb">Spieler</div><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px">'+ps.map(function(p){return'<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="font-size:26px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:14px;border:1px solid #D4D0C8;background:#F5F5F0">'+p.avatar+'</div><div style="font-size:9px;color:#999;font-weight:700">'+p.name+'</div></div>'}).join('')+'</div></div>'+(isHost?'<button class="btn" onclick="so.emit(\'startFirstRound\')">Los geht\'s</button>':'<div style="font-size:13px;color:#999">Warte auf den Host...</div>')+'</div>'}

// ═══ PLAYING ═══
function renderPlaying(){if(!room)return;clearTimeout(window._tsWait);clearTimeout(window._rt);
  // Eliminated player sees spectator screen
  var me=room.players.find(function(p){return p.id===room.myId});
  if(me&&me.eliminated){$("app").innerHTML='<div class="ct" style="padding:60px 0;animation:fadeIn .4s ease"><div style="font-size:50px;margin-bottom:16px">💀</div><div style="font-size:18px;font-weight:800;margin-bottom:8px">Du bist raus!</div><div style="font-size:13px;color:#999">Warte auf das Spielende...</div></div>';return}
  var sub=room.subs&&room.subs[room.myId];if(sub||submitted){renderWaiting();return}
  var m=MODES.find(function(x){return x.id===room.mode})||MODES[0];
  var active=room.players.filter(function(p){return!p.eliminated&&p.connected});
  var hdr='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div style="font-size:12px;color:#999">'+m.icon+' '+m.name+'</div><div style="font-size:14px;font-weight:900">R'+room.currentRound+'</div><div style="font-size:12px;color:#999">'+active.length+' Spieler</div></div>';
  if(room.mode==="bullseye"&&room.roundData&&room.roundData.teamMode){renderTeamBullseye(hdr);return}
  switch(room.mode){case"bullseye":renderBullseye(hdr);break;case"timesense":renderTimesense(hdr);break;case"memory":renderMemory(hdr);break;case"reaction":renderReaction(hdr);break}}
function doSubmit(v){if(submitted)return;submitted=true;so.emit("submit",{value:v})}
function renderWaiting(){var active=room.players.filter(function(p){return!p.eliminated&&p.connected});var done=room.subs?Object.keys(room.subs).length:0;
  $("app").innerHTML='<div class="ct" style="padding:60px 0;animation:fadeIn .4s ease"><div style="font-size:14px;color:#4AAD7A;margin-bottom:16px">✓ Gesendet</div><div style="font-size:13px;color:#999">Warte auf '+(active.length-done)+' Spieler...</div><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px">'+active.map(function(p){var has=room.subs&&room.subs[p.id];return'<div style="opacity:'+(has?'1':'.25')+';font-size:26px">'+p.avatar+'</div>'}).join('')+'</div></div>'}

// ═══ BULLSEYE ═══
function renderBullseye(hdr){var tgt=room.roundData.targetTime;
  $("app").innerHTML='<div style="animation:up .3s ease">'+hdr+'<div class="cd" style="padding:28px"><div class="ct"><div class="lb">Zielzeit</div><div style="font-size:52px;font-weight:900;margin-bottom:8px">'+tgt.toFixed(1)+'<span style="font-size:20px;color:#999">s</span></div><div style="font-size:12px;color:#999;margin-bottom:28px">START → Zähle → STOPP</div><div id="bW"><button id="bBtn" onclick="bullTap()" style="width:150px;height:150px;border-radius:50%;margin:0 auto;background:#1a1a1a;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.15);font-size:18px;font-weight:900;color:#fff;transition:all .15s">START</button></div></div></div></div>';window._bs="ready"}
function bullTap(){if(window._bs==="ready"){window._bs="timing";window._bt=performance.now();sfxTick();vb(40);var b=$("bBtn");if(b){b.textContent="STOPP";b.style.background="#D94A4A"}}
  else if(window._bs==="timing"){window._bs="done";var held=(performance.now()-window._bt)/1000;var tgt=room.roundData.targetTime;var dev=Math.abs(held-tgt);var devS=parseFloat(dev.toFixed(1));
    var b2=$("bBtn");if(b2){b2.textContent="✓";b2.style.background="#ccc"}if(dev<.15){sfxGood();vb([40,20,40])}else{sfxBad();vb(60)}
    var w=$("bW");if(w)w.innerHTML+='<div style="font-size:30px;font-weight:900;margin-top:16px">'+held.toFixed(1)+'s</div><div style="font-size:18px;font-weight:800;margin-top:8px;color:'+(dev<.1?"#4AAD7A":dev<.3?"#D4A04A":"#D94A4A")+'">'+(dev<.1?"Perfekt!":dev<.3?"Gut!":"Daneben!")+'</div><div style="font-size:14px;color:#999;margin-top:4px">'+devS+'s Abweichung</div>';doSubmit(devS)}}

// ═══ TEAM BULLSEYE ═══
function renderTeamBullseye(hdr){if(window._tbs==="timing")return;var tgt=room.roundData.targetTime;var me=room.players.find(function(p){return p.id===room.myId});var myTeam=me?me.team:null;
  var mates=room.players.filter(function(p){return p.team===myTeam&&p.connected&&!p.eliminated});
  var iDone=room.teamSubs&&room.teamSubs[room.myId];var isCaptain=mates.length>0&&mates[0].id===room.myId;
  var allDone=mates.every(function(p){return room.teamSubs&&room.teamSubs[p.id]});
  $("app").innerHTML='<div style="animation:up .3s ease">'+hdr+'<div class="cd" style="padding:20px"><div class="ct"><div class="lb">Ziel: '+tgt.toFixed(1)+'s</div><div style="font-size:12px;color:#999;margin-bottom:16px">Jeder zählt seinen Teil!</div><div style="display:flex;gap:6px;justify-content:center;margin-bottom:16px">'+mates.map(function(p){var d=room.teamSubs&&room.teamSubs[p.id];return'<div style="font-size:22px;opacity:'+(d?'1':'.3')+'">'+p.avatar+'</div>'}).join('')+'</div>'+
  (!iDone?'<div id="tbW"><button id="tbBtn" onclick="tbTap()" style="width:120px;height:120px;border-radius:50%;margin:0 auto;background:#1a1a1a;border:none;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff">START</button><div id="tbT" style="margin-top:10px;font-size:18px;font-weight:900;color:#999"></div></div>':'<div style="color:#4AAD7A;font-size:13px;margin-bottom:12px">✓ Dein Teil</div>')+
  (isCaptain&&allDone?'<div style="margin-top:16px"><div class="lb">Gesamtzeit eingeben</div><input id="tcI" class="inp" style="font-size:20px;max-width:180px" placeholder="z.B. 4.5" inputmode="decimal"><button class="btn" style="margin-top:10px" onclick="tConf()">Bestätigen</button></div>':'')+'</div></div></div>';window._tbs="ready"}
function tbTap(){if(window._tbs==="ready"){window._tbs="timing";window._tbt=performance.now();sfxTick();vb(40);var b=$("tbBtn");if(b){b.textContent="STOPP";b.style.background="#D94A4A"}}
  else if(window._tbs==="timing"){window._tbs="done";var h=(performance.now()-window._tbt)/1000;var b2=$("tbBtn");if(b2){b2.textContent="✓";b2.style.background="#ccc"}sfxGood();var t=$("tbT");if(t)t.textContent=h.toFixed(1)+"s";so.emit("teamSubmit",{value:h})}}
function tConf(){var el=$("tcI");if(!el)return;var v=parseFloat(el.value);if(isNaN(v)||v<=0)return;sfxTick();so.emit("teamConfirm",{teamTotal:v})}

// ═══ TIMESENSE ═══
function renderTimesense(hdr){
  $("app").innerHTML='<div style="animation:up .3s ease">'+hdr+'<div class="cd" style="padding:28px"><div class="ct" id="tC"><div style="font-size:13px;color:#999;margin-bottom:24px">Warte auf Grün...</div><div id="tBz" style="width:160px;height:160px;border-radius:50%;margin:0 auto;background:#D94A4A;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(217,74,74,.2);transition:all .3s"><span id="tLb" style="font-size:18px;font-weight:900;color:#fff">WARTE</span></div><div id="tSb" style="font-size:12px;color:#999;margin-top:16px">Gleich...</div></div></div></div>';
  var wMs=Math.round((room.roundData.waitDelay||3)*1000);
  window._tsWait=setTimeout(function(){if(!room||room.phase!=="playing")return;sfxGo();vb([100,40,100,40,150]);window._tsT0=Date.now();
    var b=$("tBz");if(!b)return;b.style.background="#4AAD7A";b.style.boxShadow="0 4px 30px rgba(74,173,122,.3)";
    var l=$("tLb");if(l)l.textContent="ZÄHLE!";var s=$("tSb");if(s){s.style.color="#4AAD7A";s.textContent="Ab jetzt im Kopf zählen!"}},wMs)}
function renderZeitInput(){if(submitted||!room||room.phase!=="playing")return;
  var el=$("tC");if(!el){$("app").innerHTML='<div class="cd" style="padding:28px"><div class="ct" id="tC"></div></div>';el=$("tC")}
  el.innerHTML='<div style="animation:pop .4s ease"><div style="font-size:36px;font-weight:900;color:#D94A4A;margin-bottom:16px">STOPP</div><div style="font-size:14px;font-weight:700;margin-bottom:16px">Wie lange war das?</div><div style="max-width:180px;margin:0 auto"><input id="tI" class="inp" style="font-size:22px" placeholder="z.B. 3.5" inputmode="decimal"></div><button class="btn btn-blue" style="margin-top:14px" onclick="zeitSub()">Bestätigen</button></div>';
  setTimeout(function(){var i=$("tI");if(i)i.focus()},100)}
function zeitSub(){var el=$("tI");if(!el)return;var g=parseFloat(el.value);if(isNaN(g)||g<=0)return;var actual=window._zeitActual||0;var dev=Math.abs(g-actual);var devS=parseFloat(dev.toFixed(1));
  if(dev<.3){sfxGood();vb([40,20,40])}else{sfxBad();vb(60)}
  ($("tC")||$("app")).innerHTML='<div class="ct" style="padding:20px"><div style="font-size:14px;color:#999;margin-bottom:4px">Tipp: '+g.toFixed(1)+'s</div><div style="font-size:14px;color:#999;margin-bottom:12px">Tatsächlich: '+actual.toFixed(1)+'s</div><div style="font-size:22px;font-weight:900;color:'+(dev<.3?"#4AAD7A":dev<1?"#D4A04A":"#D94A4A")+'">'+(dev<.3?"Stark!":dev<1?"Knapp!":"Daneben!")+'</div><div style="font-size:14px;color:#999;margin-top:4px">'+devS+'s Abweichung</div></div>';doSubmit(devS)}

// ═══ MEMORY (self-start) ═══
function renderMemory(hdr){
  var ready=room.readyPlayers&&room.readyPlayers[room.myId];
  if(ready){$("app").innerHTML='<div style="animation:fadeIn .3s ease">'+hdr+'<div class="cd" style="padding:28px"><div class="ct" id="mC"><div style="font-size:13px;color:#999">Warte auf alle Spieler...</div><div style="font-size:40px;margin-top:20px;animation:pulse 1s infinite">👀</div></div></div></div>';return}
  $("app").innerHTML='<div style="animation:up .3s ease">'+hdr+'<div class="cd" style="padding:28px"><div class="ct"><div style="font-size:14px;font-weight:700;margin-bottom:8px">Memory</div><div style="font-size:13px;color:#999;margin-bottom:24px">Wenn du bereit bist, drück den Button.<br>Die Zahl erscheint kurz — merk sie dir!</div><button class="btn" onclick="so.emit(\'playerReady\')">Ich bin bereit</button></div></div></div>'}
function showMemoryNumber(){
  var shown=room.roundData.shownTime;var dur=room.roundData.showDuration||300;
  sfxTick();vb(40);
  var mc=$("mC");if(!mc)return;
  mc.innerHTML='<div style="animation:pop .2s ease"><div style="font-size:52px;font-weight:900;color:#4AAD7A;margin:20px 0;font-family:monospace">'+shown.toFixed(1)+'<span style="font-size:20px;color:#999">s</span></div></div>';
  setTimeout(function(){var mc2=$("mC");if(!mc2)return;sfxStop();vb(40);
    mc2.innerHTML='<div style="animation:up .4s ease"><div class="lb">Was war die Zahl?</div><div style="font-size:40px;margin:16px 0">🤔</div><div style="max-width:180px;margin:0 auto 16px"><input id="mI" class="inp" style="font-size:22px" placeholder="?.?s" inputmode="decimal"></div><button class="btn btn-green" onclick="memSub()">Bestätigen</button></div>';
    setTimeout(function(){var i=$("mI");if(i)i.focus()},100)},dur)}
function memSub(){var el=$("mI");if(!el)return;var g=parseFloat(el.value);if(isNaN(g))return;var shown=room.roundData.shownTime;var dev=Math.abs(g-shown);var devS=parseFloat(dev.toFixed(1));
  if(dev<.2){sfxGood();vb([40,20,40])}else{sfxBad();vb(60)}
  var mc=$("mC");if(mc)mc.innerHTML='<div style="font-size:14px;color:#999;margin-bottom:4px">Tipp: '+g.toFixed(1)+'s</div><div style="font-size:14px;color:#999;margin-bottom:12px">Richtig: '+shown.toFixed(1)+'s</div><div style="font-size:22px;font-weight:900;color:'+(dev<.2?"#4AAD7A":dev<.5?"#D4A04A":"#D94A4A")+'">'+devS+'s</div>';doSubmit(devS)}

// ═══ REACTION (10 buzzers) ═══
function renderReaction(hdr){var gIdx=room.roundData.greenIdx;
  var bhtml='';for(var i=0;i<10;i++){bhtml+='<div id="rz'+i+'" onclick="rzTap('+i+')" style="width:56px;height:56px;border-radius:50%;background:#D94A4A;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(217,74,74,.15);transition:all .2s;user-select:none"><span style="font-size:12px;font-weight:900;color:#fff;pointer-events:none;opacity:.5">'+(i+1)+'</span></div>'}
  $("app").innerHTML='<div style="animation:up .3s ease">'+hdr+'<div class="cd" style="padding:20px"><div class="ct"><div style="font-size:13px;color:#999;margin-bottom:16px">Warte auf den grünen Buzzer!</div><div id="rzGrid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:320px;margin:0 auto">'+bhtml+'</div><div id="rzSub" style="font-size:12px;color:#999;margin-top:16px">Nicht zu früh!</div></div></div></div>';
  window._rs="ready";window._rGreen=gIdx;
  window._rt=setTimeout(function(){if(!room||room.phase!=="playing")return;window._rs="go";window._r0=performance.now();sfxGo();vb([80,30,80,30,120]);
    var gz=$("rz"+gIdx);if(gz){gz.style.background="#4AAD7A";gz.style.boxShadow="0 2px 16px rgba(74,173,122,.4)";gz.querySelector("span").style.opacity="1"}
    var s=$("rzSub");if(s){s.style.color="#4AAD7A";s.textContent="Grünen drücken!"}
  },2000+Math.random()*4000)}
function rzTap(idx){if(window._rs==="ready"){clearTimeout(window._rt);window._rs="early";sfxBad();vb(80);
    var b=$("rz"+idx);if(b)b.style.background="#999";
    var s=$("rzSub");if(s)s.innerHTML='<div style="color:#D94A4A;font-weight:700">Zu früh! 5s Strafe</div><button class="btn" style="margin-top:12px;max-width:200px" onclick="doSubmit(5)">Weiter</button>';
  } else if(window._rs==="go"){window._rs="done";
    if(idx!==window._rGreen){sfxBad();vb(80);var s2=$("rzSub");if(s2)s2.innerHTML='<div style="color:#D94A4A;font-weight:700">Falscher Buzzer! 5s Strafe</div>';doSubmit(5);return}
    var rt=(performance.now()-window._r0)/1000;var rtS=parseFloat(rt.toFixed(1));if(rt<.25){sfxGood();vb([40,20,40])}else{sfxBad();vb(60)}
    var b2=$("rz"+idx);if(b2){b2.style.background="#1a1a1a"}
    var s3=$("rzSub");if(s3)s3.innerHTML='<div style="font-size:28px;font-weight:900">'+rt.toFixed(2)+'s</div><div style="font-size:14px;color:'+(rt<.2?"#4AAD7A":rt<.35?"#D4A04A":"#D94A4A")+';margin-top:4px">'+(rt<.2?"Blitz!":rt<.35?"Schnell!":rt<.5?"OK":"Langsam!")+'</div>';
    doSubmit(rtS)}}

// ═══ RESULTS ═══
function renderResults(){submitted=false;sfxGood();vb(30);var res=room.results||[],isHost=room.hostId===room.myId,m=MODES.find(function(x){return x.id===room.mode})||MODES[0];
  var html='<div style="animation:pop .4s ease"><div class="ct" style="margin-bottom:16px"><div class="lb">Runde '+room.currentRound+'</div><div style="font-size:14px;font-weight:800;margin-top:4px">'+m.icon+' '+m.name+'</div></div><div class="cd" style="margin-bottom:20px">';
  res.forEach(function(r,i){var medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1);var isMe=r.pid===room.myId;
    html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:'+(i<res.length-1?"1px solid #E8E4DE":"none")+';animation:slideIn .3s ease '+(i*.08)+'s both"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:'+(i<3?'18':'13')+'px">'+medal+'</span><span style="font-size:16px">'+r.avatar+'</span><span style="font-size:13px;font-weight:'+(isMe?'800':'600')+';color:'+(isMe?"#4A90D9":"#1a1a1a")+'">'+r.name+'</span></div><div style="font-size:14px;font-weight:900;font-family:monospace;color:#999">'+r.value.toFixed(1)+'s</div></div>'});
  html+='</div>';
  if(isHost){html+='<div class="ct" style="display:flex;flex-direction:column;align-items:center;gap:10px"><button class="btn" onclick="so.emit(\'nextRound\')">Weiter ▶</button><button class="btn2" style="font-size:11px" onclick="so.emit(\'endGame\')">Beenden</button></div>'}
  else html+='<div class="ct" style="font-size:12px;color:#999;margin-top:16px">Warte auf den Host...</div>';
  html+='</div>';$("app").innerHTML=html}

// ═══ ELIMINATION ═══
function renderElimination(){sfxElim();vb([80,40,80,40,200]);
  var eliminated=room.players.filter(function(p){return p.eliminated});var last=eliminated[eliminated.length-1];
  var active=room.players.filter(function(p){return!p.eliminated&&p.connected});var isHost=room.hostId===room.myId;
  $("app").innerHTML='<div class="ct" style="animation:pop .5s ease;padding-top:30px"><div style="font-size:50px;margin-bottom:16px;animation:shake .5s ease">💀</div><div style="font-size:22px;font-weight:900;margin-bottom:8px">Elimination!</div>'+(last?'<div style="font-size:36px;margin:16px 0">'+last.avatar+'</div><div style="font-size:16px;font-weight:700;color:#D94A4A">'+last.name+' ist raus!</div>':'')+'<div style="font-size:13px;color:#999;margin-top:20px">Noch '+active.length+' Spieler übrig</div><div style="display:flex;gap:8px;justify-content:center;margin-top:12px">'+active.map(function(p){return'<div style="font-size:24px">'+p.avatar+'</div>'}).join('')+'</div>'+(isHost?'<button class="btn" style="margin-top:24px" onclick="so.emit(\'continueAfterElim\')">Weiter</button>':'<div style="font-size:12px;color:#999;margin-top:24px">Warte auf den Host...</div>')+'</div>'}

// ═══ GAME OVER ═══
function renderGameOver(){submitted=false;sfxWin();vb([50,30,50,30,50,30,100]);
  var sc=room.finalScores||{};var sorted=Object.entries(sc).sort(function(a,b){return b[1]-a[1]});var isHost=room.hostId===room.myId;
  var winner=room.players.find(function(p){return!p.eliminated&&p.connected});
  var html='<div style="animation:pop .5s ease"><div class="ct" style="margin-bottom:24px"><div style="font-size:56px;animation:float 2s ease infinite">🏆</div>'+(winner?'<div style="font-size:40px;margin-top:8px">'+winner.avatar+'</div><div style="font-size:22px;font-weight:900;margin-top:4px">'+winner.name+' gewinnt!</div>':'<div style="font-size:22px;font-weight:900;margin-top:8px">Spiel vorbei!</div>')+'</div><div class="cd" style="margin-bottom:20px">';
  sorted.forEach(function(e,i){var pid=e[0],pts=e[1];var p=room.players.find(function(x){return x.id===pid});if(!p)return;var medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1);var isW=i===0;
    html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:'+(isW?"16px 0":"10px 0")+';border-bottom:'+(i<sorted.length-1?"1px solid #E8E4DE":"none")+';animation:slideIn .4s ease '+(i*.12)+'s both"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:'+(isW?'24':'16')+'px">'+medal+'</span><span style="font-size:'+(isW?'26':'18')+'px">'+p.avatar+'</span><span style="font-size:'+(isW?'14':'12')+'px;font-weight:'+(isW?'900':'600')+'">'+p.name+(p.eliminated?' <span style="font-size:9px;color:#D94A4A">✕</span>':'')+'</span></div><div style="font-size:'+(isW?'16':'13')+'px;font-weight:900;color:#999">'+pts+'</div></div>'});
  html+='</div>';if(isHost)html+='<div class="ct"><button class="btn" style="margin-bottom:12px" onclick="so.emit(\'playAgain\')">Nochmal</button></div>';
  html+='<div class="ct"><button class="btn2" onclick="home()">← Startseite</button></div></div>';$("app").innerHTML=html}
</script></body></html>
