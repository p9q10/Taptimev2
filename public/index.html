<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>TimeTap</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
:root{
  --bg:#060912;--surf:#0B1020;--raised:#121833;--border:#1A2048;--hl:#252B58;
  --gold:#D4922A;--goldb:#EEAB38;--teal:#00D4AA;
  --red:#FF3355;--green:#22CC66;--amber:#EE8818;--blue:#3878E0;
  --text:#D0CEE0;--sub:#4E5278;--muted:#242848;
  --f:'Orbitron',sans-serif;--mono:'Share Tech Mono',monospace;
  --gG:0 0 30px rgba(212,146,42,.5),0 0 80px rgba(212,146,42,.1);
  --gT:0 0 30px rgba(0,212,170,.5),0 0 80px rgba(0,212,170,.1);
  --gR:0 0 30px rgba(255,51,85,.5),0 0 80px rgba(255,51,85,.12);
  --gGr:0 0 30px rgba(34,204,102,.5),0 0 80px rgba(34,204,102,.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:var(--f);background:var(--bg);color:var(--text);min-height:100dvh;
  background-image:
    radial-gradient(ellipse 70% 50% at 50% 0%,rgba(25,18,60,.5) 0%,transparent 65%),
    radial-gradient(ellipse 50% 40% at 50% 100%,rgba(10,6,30,.4) 0%,transparent 60%);
}
/* Subtle tick-mark texture overlay */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg,transparent 5.5deg,rgba(255,255,255,.004) 6deg,transparent 6.5deg);
  opacity:.5;
}
#app{max-width:440px;margin:0 auto;padding:14px 16px 44px;position:relative;z-index:1}
button{font-family:var(--f);cursor:pointer;border:none;outline:none}
input{font-family:var(--f);outline:none}

/* ─── BUTTONS ─── */
.btn{
  border-radius:999px;padding:15px 32px;color:#000;
  font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  background:linear-gradient(160deg,#F0C050,var(--goldb),var(--gold),#A87020);
  border:none;transition:transform .12s,box-shadow .2s;
  width:100%;max-width:300px;
  box-shadow:var(--gG),inset 0 1px 0 rgba(255,255,255,.2);
  font-family:var(--f);
  text-shadow:0 1px 2px rgba(0,0,0,.3);
}
.btn:active{transform:scale(.93)}.btn:disabled{opacity:.2;box-shadow:none}
.btn-blue{background:linear-gradient(160deg,#5898F0,var(--blue),#2858A8);color:#fff;box-shadow:0 0 30px rgba(56,120,224,.5);text-shadow:none}
.btn-green{background:linear-gradient(160deg,#40E888,var(--green),#18884A);color:#000;box-shadow:var(--gGr)}
.btn-red{background:linear-gradient(160deg,#FF6080,var(--red),#AA2038);color:#fff;box-shadow:var(--gR);text-shadow:none}
.btn2{
  border-radius:999px;padding:10px 20px;
  color:var(--sub);font-size:9px;font-weight:700;letter-spacing:2px;
  background:var(--raised);border:1px solid var(--border);
  font-family:var(--f);transition:transform .1s
}
.btn2:active{transform:scale(.96)}

/* ─── INPUTS ─── */
.inp{
  font-size:14px;color:var(--text);
  background:linear-gradient(180deg,#0A0E1C,#0E1428);
  border:2px solid var(--border);border-radius:999px;
  padding:14px 22px;text-align:center;width:100%;font-weight:700;
  font-family:var(--f);letter-spacing:2px;
  box-shadow:inset 0 4px 12px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.03);
}
.inp:focus{border-color:var(--gold);box-shadow:inset 0 4px 12px rgba(0,0,0,.5),0 0 0 3px rgba(212,146,42,.12),0 0 20px rgba(212,146,42,.08)}

/* ─── CARDS ─── */
.cd{
  border-radius:28px;
  background:linear-gradient(165deg,rgba(14,18,38,.95),rgba(8,11,22,.98));
  border:1px solid var(--border);padding:18px;
  box-shadow:0 8px 32px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.03) inset;
}
.ct{text-align:center}
.lb{font-size:8px;color:var(--sub);letter-spacing:4px;text-transform:uppercase;margin-bottom:8px;font-weight:700}

/* ─── DISPLAY ─── */
.dsp{
  font-family:var(--mono);color:var(--teal);
  text-shadow:0 0 8px rgba(0,212,170,.6),0 0 30px rgba(0,212,170,.25),0 0 60px rgba(0,212,170,.08);
}

/* ─── WATCH BEZEL ─── */
.wBezel{
  border-radius:50%;
  background:conic-gradient(from 0deg,#1A1E38,#282E58,#1A1E38,#101428,#1A1E38);
  padding:3px;
  box-shadow:0 0 40px rgba(0,0,0,.8),0 0 0 2px rgba(212,146,42,.15),inset 0 0 20px rgba(0,0,0,.5);
}
.wFace{
  border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#101830,#080C18);
  border:1px solid rgba(255,255,255,.04);
  position:relative;overflow:hidden;
}
/* Glass reflection on face */
.wFace::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 45%,transparent 55%,rgba(255,255,255,.02) 100%);
  pointer-events:none;
}

/* ─── ANIMATIONS ─── */
@keyframes pop{0%{transform:scale(.25);opacity:0}60%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slideIn{0%{transform:translateY(18px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes splashFade{0%{opacity:1}76%{opacity:1}100%{opacity:0;pointer-events:none}}
@keyframes spinR{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@keyframes sHand{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes goldPulse{0%,100%{box-shadow:0 0 26px rgba(212,146,42,.35),0 6px 40px rgba(0,0,0,.7)}50%{box-shadow:0 0 70px rgba(212,146,42,.9),0 0 140px rgba(212,146,42,.15),0 6px 40px rgba(0,0,0,.7)}}
@keyframes redPulse{0%,100%{box-shadow:0 0 26px rgba(255,51,85,.4),0 6px 40px rgba(0,0,0,.7)}50%{box-shadow:0 0 70px rgba(255,51,85,.95),0 0 140px rgba(255,51,85,.15),0 6px 40px rgba(0,0,0,.7)}}
@keyframes greenPulse{0%,100%{box-shadow:0 0 26px rgba(34,204,102,.4),0 6px 40px rgba(0,0,0,.7)}50%{box-shadow:0 0 80px rgba(34,204,102,1),0 0 150px rgba(34,204,102,.2),0 6px 40px rgba(0,0,0,.7)}}
@keyframes ringExpand{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}
@keyframes tickFlash{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes glowBreath{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes dialSweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style></head><body>

<!-- ═══ SPLASH — Premium Chronograph ═══ -->
<div id="splash" style="position:fixed;inset:0;background:#060912;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:splashFade 2.6s ease forwards;background-image:radial-gradient(ellipse 60% 45% at 50% 40%,rgba(212,146,42,.06) 0%,transparent 70%)">

  <div style="position:relative;width:160px;height:190px;margin-bottom:28px">
    <!-- Crown -->
    <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:20px;background:linear-gradient(180deg,#C08828,#A07020,#886018);border-radius:6px 6px 3px 3px;box-shadow:0 0 14px rgba(212,146,42,.5),inset 0 1px 0 rgba(255,255,255,.3)"></div>
    <!-- Crown knurling -->
    <div style="position:absolute;top:4px;left:50%;transform:translateX(-50%);width:20px;height:12px;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.3) 2px,rgba(0,0,0,.3) 3px);border-radius:4px"></div>
    <!-- Pusher right -->
    <div style="position:absolute;top:40px;right:2px;width:10px;height:20px;background:linear-gradient(180deg,#282E50,#181C38);border-radius:0 5px 5px 0;border:1px solid #1A2048"></div>
    <!-- Lugs -->
    <div style="position:absolute;top:22px;left:10px;width:22px;height:7px;background:linear-gradient(90deg,#181C38,#0E1225);border-radius:4px;transform:rotate(-18deg);border:1px solid #1A2048"></div>
    <div style="position:absolute;top:22px;right:10px;width:22px;height:7px;background:linear-gradient(-90deg,#181C38,#0E1225);border-radius:4px;transform:rotate(18deg);border:1px solid #1A2048"></div>

    <!-- Bezel -->
    <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:144px;height:144px;border-radius:50%;background:conic-gradient(from 0deg,#22284A,#2E3460,#22284A,#14182E,#22284A);padding:3px;box-shadow:0 0 60px rgba(212,146,42,.25),0 0 0 1px rgba(212,146,42,.2),0 12px 40px rgba(0,0,0,.9)">
      <div style="width:100%;height:100%;border-radius:50%;border:2px solid rgba(212,146,42,.5);position:relative;overflow:hidden">
        <!-- Ticks -->
        <div style="position:absolute;top:5px;left:50%;width:3px;height:10px;background:var(--goldb);transform:translateX(-50%);border-radius:2px;box-shadow:0 0 6px rgba(212,146,42,.8)"></div>
        <div style="position:absolute;right:5px;top:50%;width:10px;height:3px;background:var(--goldb);transform:translateY(-50%);border-radius:2px"></div>
        <div style="position:absolute;bottom:5px;left:50%;width:3px;height:10px;background:var(--goldb);transform:translateX(-50%);border-radius:2px"></div>
        <div style="position:absolute;left:5px;top:50%;width:10px;height:3px;background:var(--goldb);transform:translateY(-50%);border-radius:2px"></div>
        <!-- Minor ticks -->
        <div style="position:absolute;top:12px;left:22px;width:2px;height:6px;background:rgba(212,146,42,.3);border-radius:2px;transform:rotate(-45deg)"></div>
        <div style="position:absolute;top:12px;right:22px;width:2px;height:6px;background:rgba(212,146,42,.3);border-radius:2px;transform:rotate(45deg)"></div>
        <div style="position:absolute;bottom:12px;left:22px;width:2px;height:6px;background:rgba(212,146,42,.3);border-radius:2px;transform:rotate(45deg)"></div>
        <div style="position:absolute;bottom:12px;right:22px;width:2px;height:6px;background:rgba(212,146,42,.3);border-radius:2px;transform:rotate(-45deg)"></div>

        <!-- Face -->
        <div style="position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#10152A,#060A14);border:1px solid rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;overflow:hidden">
          <!-- Glass sheen -->
          <div style="position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,transparent 40%,transparent 60%,rgba(255,255,255,.02) 100%);pointer-events:none;z-index:5"></div>
          <!-- Sub-dial ring -->
          <div style="position:absolute;top:20%;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;border:1px solid rgba(212,146,42,.15)"></div>
          <!-- Hour hand -->
          <div style="position:absolute;bottom:50%;left:50%;width:4px;height:24px;background:linear-gradient(0deg,#D0CEE0,#888AA0);transform-origin:bottom center;transform:translateX(-50%) rotate(120deg);border-radius:3px 3px 0 0"></div>
          <!-- Minute hand -->
          <div style="position:absolute;bottom:50%;left:50%;width:3px;height:34px;background:linear-gradient(0deg,#D0CEE0,#A0A2B8);transform-origin:bottom center;transform:translateX(-50%) rotate(-50deg);border-radius:2px 2px 0 0"></div>
          <!-- Counterweight -->
          <div style="position:absolute;top:50%;left:50%;width:3px;height:10px;background:var(--goldb);opacity:.5;transform-origin:top center;transform:translateX(-50%)"></div>
          <!-- Second hand -->
          <div style="position:absolute;bottom:50%;left:50%;width:1.5px;height:42px;background:linear-gradient(0deg,transparent 0%,var(--goldb) 25%);transform-origin:bottom center;transform:translateX(-50%);border-radius:2px;animation:sHand 2s steps(60) infinite;box-shadow:0 0 8px rgba(212,146,42,.9)"></div>
          <!-- Center cap -->
          <div style="width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#F0C050,var(--goldb));z-index:4;box-shadow:0 0 12px rgba(212,146,42,1)"></div>
        </div>
      </div>
    </div>
  </div>

  <div style="font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;color:var(--goldb);letter-spacing:10px;text-shadow:0 0 30px rgba(212,146,42,.4),0 2px 4px rgba(0,0,0,.8)">TIMETAP</div>
  <div style="font-size:8px;color:var(--sub);margin-top:8px;letter-spacing:8px;font-family:var(--f);font-weight:700">PARTY GAME</div>
  <div style="margin-top:28px;width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--goldb);border-radius:50%;animation:spinR 1s linear infinite"></div>
</div>

<div id="app"></div>

<script>
/* ── AUDIO ── */
var actx=null;function initAudio(){if(!actx)try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function sfx(f,d,t,v){initAudio();if(!actx)return;try{var o=actx.createOscillator(),g=actx.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=v||.2;g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function sfxTick(){sfx(600,.06,"sine",.3)}
function sfxGo(){sfx(440,.15,"sine",.3);setTimeout(function(){sfx(554,.15,"sine",.3)},100);setTimeout(function(){sfx(660,.25,"sine",.35)},200)}
function sfxStop(){sfx(330,.4,"square",.25);setTimeout(function(){sfx(220,.4,"square",.2)},120)}
function sfxGood(){sfx(660,.12,"sine",.3);setTimeout(function(){sfx(880,.18,"sine",.3)},100)}
function sfxBad(){sfx(180,.4,"sawtooth",.2)}
function sfxElim(){sfx(440,.3,"square",.2);setTimeout(function(){sfx(330,.3,"square",.2)},200);setTimeout(function(){sfx(220,.5,"square",.25)},400)}
function sfxWin(){sfx(523,.15,"sine",.3);setTimeout(function(){sfx(659,.15)},120);setTimeout(function(){sfx(784,.15)},240);setTimeout(function(){sfx(1047,.3)},360)}
function vb(p){try{navigator.vibrate(p)}catch(e){}}

/* ── SOCKET & STATE ── */
var so=io(location.origin,{reconnection:true,reconnectionAttempts:30});
var myId=null,room=null,myName="",myAvatar="😎",selFormat="ffa";
var AV=["😎","🔥","⚡","🎯","💀","👾","🤖","🎮","🦊","🐸","🌟","💎","🎪","🎭","🃏","🧨"];
var MI={
  bullseye:{name:"Bullseye",icon:"🎯",color:"#D4922A",desc:"START drücken, Zielzeit im Kopf zählen, STOPP drücken."},
  timesense:{name:"Zeitgefühl",icon:"🧠",color:"#3878E0",desc:"Buzzer wird grün = zählen! Die App stoppt automatisch."},
  memory:{name:"Memory",icon:"💾",color:"#22CC66",desc:"Zahl blitzt kurz auf. Merken und eingeben!"},
  reaction:{name:"Reaktion",icon:"⚡",color:"#EE8818",desc:"10 Buzzer. Einer wird grün. Sofort drücken!"}
};
var SEGS=[{id:"bullseye",color:"#D4922A"},{id:"timesense",color:"#3878E0"},{id:"memory",color:"#22CC66"},{id:"reaction",color:"#EE8818"}];

function $(id){return document.getElementById(id)}
function fullClientReset(){clearTimeout(window._tsWait);clearTimeout(window._rt);window._bs=null;window._rs=null;window._tbs=null;submitted=false;lastRound=0;lastPhase="";lastTeamSubCount=0}
setTimeout(function(){var s=$("splash");if(s)s.style.display="none";home()},2600);
so.on("connect",function(){myId=so.id;
  if(window._lastRoomCode&&myName){
    so.emit("rejoin",{code:window._lastRoomCode,name:myName},function(r){
      if(r&&r.ok){so.emit("requestSync")}else{window._lastRoomCode=null}
    });
  }
});
var lastPhase="",lastRound=0,submitted=false,lastTeamSubCount=0;

/* ── VISIBILITY / RESUME HANDLING ── */
var _bgTime=0;
document.addEventListener("visibilitychange",function(){
  if(document.hidden){
    _bgTime=Date.now();
  }else{
    var away=Date.now()-_bgTime;
    if(actx&&actx.state==="suspended")try{actx.resume()}catch(e){}
    if(!so.connected){so.connect()}
    if(room&&window._lastRoomCode){
      lastPhase="";
      so.emit("requestSync");
    }
  }
});
window.addEventListener("focus",function(){
  if(room&&window._lastRoomCode&&so.connected){
    lastPhase="";
    so.emit("requestSync");
  }
});
so.on("reconnect",function(){
  if(window._lastRoomCode&&myName){
    so.emit("rejoin",{code:window._lastRoomCode,name:myName},function(r){
      if(r&&r.ok){lastPhase="";so.emit("requestSync")}else{window._lastRoomCode=null}
    });
  }
});

so.on("sync",function(data){room=data;
  if(room.code)window._lastRoomCode=room.code;
  if(room.phase==="playing"&&room.currentRound!==lastRound){submitted=false;lastRound=room.currentRound}
  if(room.phase==="playing"&&submitted){renderWaiting();lastPhase=room.phase;return}
  var tsC=room.teamSubs?Object.keys(room.teamSubs).length:0;var tCh=room.roundData&&room.roundData.teamMode&&tsC!==lastTeamSubCount;if(tCh)lastTeamSubCount=tsC;
  if(room.phase==="playing"&&lastPhase==="playing"&&!submitted&&!tCh)return;
  if(room.phase===lastPhase&&(room.phase==="results"||room.phase==="gameover"||room.phase==="pregame"||room.phase==="elimination"||room.phase==="spin"))return;
  lastPhase=room.phase;render()});
so.on("zeitStop",function(d){if(submitted||!room||room.phase!=="playing"||room.mode!=="timesense")return;window._zeitActual=d.actual;sfxStop();vb([80,30,80]);renderZeitInput()});

function render(){if(!room)return;switch(room.phase){case"lobby":renderLobby();break;case"pregame":renderPreGame();break;case"spin":renderSpin();break;case"playing":renderPlaying();break;case"results":renderResults();break;case"elimination":renderElimination();break;case"gameover":renderGameOver();break}}

/* ══ HOME ══ */
function home(){so.emit("leave");room=null;window._lastRoomCode=null;fullClientReset();
$("app").innerHTML=
'<div style="animation:up .55s ease;padding-top:20px">'+
'<div class="ct" style="margin-bottom:42px">'+
  /* Stopwatch icon */
  '<div style="position:relative;width:80px;height:80px;margin:0 auto 18px">'+
    '<div style="position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#1A1E38,#282E58,#1A1E38,#101428,#1A1E38);padding:3px;box-shadow:0 0 40px rgba(212,146,42,.2)">'+
      '<div style="width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#101830,#060A14);border:2px solid rgba(212,146,42,.4);display:flex;align-items:center;justify-content:center">'+
        '<div style="font-family:var(--mono);font-size:16px;color:var(--teal);text-shadow:0 0 10px rgba(0,212,170,.6)">⏱</div>'+
      '</div>'+
    '</div>'+
    '<div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:14px;height:10px;background:linear-gradient(180deg,#C08828,#886018);border-radius:4px 4px 2px 2px;box-shadow:0 0 8px rgba(212,146,42,.4)"></div>'+
  '</div>'+
  '<div style="font-family:\'Orbitron\',sans-serif;font-size:22px;font-weight:900;color:var(--goldb);letter-spacing:8px;text-shadow:0 0 24px rgba(212,146,42,.35),0 2px 3px rgba(0,0,0,.7)">TIMETAP</div>'+
  '<div style="font-size:7px;color:var(--sub);letter-spacing:6px;margin-top:6px;font-weight:700">PARTY GAME</div>'+
'</div>'+
'<div style="display:flex;flex-direction:column;gap:18px;align-items:center">'+

  /* ── All vs All ── */
  '<button onclick="initAudio();selFormat=\'ffa\';setupRoom()" style="width:100%;padding:20px;display:flex;align-items:center;gap:18px;text-align:left;border-radius:50px;border:1px solid var(--border);color:var(--text);background:linear-gradient(165deg,rgba(14,18,38,.9),rgba(8,11,22,.95));box-shadow:0 8px 32px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.03);cursor:pointer;font-family:\'Orbitron\',sans-serif;transition:all .2s">'+
    '<div style="position:relative;flex-shrink:0;width:62px;height:62px">'+
      '<div style="position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 45deg,#D4922A,#F0C050,#D4922A,#A07020,#D4922A);padding:2px;box-shadow:0 0 24px rgba(212,146,42,.4)"><div style="width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#101830,#060A14);display:flex;align-items:center;justify-content:center;font-size:24px">⚔️</div></div>'+
    '</div>'+
    '<div><div style="font-size:13px;font-weight:700;letter-spacing:1px">Alle gegen Alle</div><div style="font-size:8px;color:var(--sub);margin-top:4px;font-weight:700;letter-spacing:2px">ELIMINATION BIS ZUM SIEGER</div></div>'+
  '</button>'+
